<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オフィストラベル - 試作</title>
<style>
  :root{--bg:#0e1420;--panel:rgba(15,20,32,.92);--fg:#f2f4f8;--dim:#9aa4b8;--acc:#ffcc4d;--ok:#6ee7a1;--ng:#ff7b7b;--ad:#7cc4ff;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;user-select:none}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
  #hud{position:absolute;left:8px;top:6px;display:flex;gap:10px;align-items:center;pointer-events:none;text-shadow:0 1px 2px #000}
  #hud b{font-size:18px;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .badge{background:rgba(0,0,0,.6);border-radius:10px;padding:1px 7px;font-size:11px;color:#dfe4ee}
  .badge.on{color:var(--ok);background:rgba(20,80,50,.6)}
  .badge.boost{color:var(--ad);background:rgba(30,60,110,.6)}
  #btns{position:absolute;right:8px;top:6px;display:flex;gap:6px}
  button{background:rgba(0,0,0,.55);color:var(--fg);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
  button:hover{background:rgba(255,255,255,.12)}
  button:disabled{opacity:.4;cursor:default}
  button.buy{color:var(--acc)}
  button.ad{color:var(--ad)}
  #panel{position:absolute;right:8px;top:36px;bottom:8px;width:340px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;overflow:auto;backdrop-filter:blur(4px)}
  #panel h3{margin:0 0 8px;font-size:14px;color:var(--acc)}
  #panel .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #panel .row small{display:block;color:var(--dim)}
  #panel .row button{white-space:nowrap}
  #panel .note{color:var(--dim);font-size:11px;margin-top:8px}
  .tabs{display:flex;gap:4px;margin-bottom:8px}
  .tabs button{flex:1;padding:4px 0}
  .tabs button.act{background:rgba(255,204,77,.2);border-color:var(--acc)}
  #modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  #modal .box{background:var(--panel);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 16px;min-width:280px;max-width:92%;max-height:94%;overflow:auto;text-align:center;font-size:12px;line-height:1.35}
  #modal .box h2{margin:0 0 2px;font-size:15px;color:var(--acc)}
  #modal .box p{margin:2px 0 6px;color:var(--dim)}
  #modal .box .big{font-size:22px;color:var(--fg);margin:6px 0}
  #modal .box button{margin:3px}
  .hidden{display:none!important}
  #toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:4px 12px;border-radius:8px;color:var(--ok);pointer-events:none;transition:opacity .4s;opacity:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div><b id="money">¥0</b> <span id="rate" class="badge">+0/秒</span></div>
  <span id="watch" class="badge">見守り ×1.5</span>
  <span id="boost" class="badge boost hidden">臨時列車 ×2</span>
  <span id="region" class="badge"></span>
  <span id="dist" class="badge"></span>
  <span class="badge" style="color:var(--dim)">オフィストラベル</span>
</div>
<div id="btns">
  <button id="bBuild">建設</button>
  <button id="bAd" class="ad">広告</button>
  <button id="bShop" class="buy">ショップ</button>
  <button id="bLog">日誌</button>
  <button id="bMore">…</button>
</div>
<div id="panel" class="hidden"></div>
<div id="modal" class="hidden"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

function collect(kind,text){const a=S.alt;const add=(arr,v)=>{if(!arr.includes(v))arr.push(v);};
  if(kind==='food')add(a.food,text);else if(kind==='people')add(a.people,text);else if(kind==='skill')add(a.skills,text);else if(kind==='photo')add(a.photos,text);
  else if(kind==='book')a.books++;else if(kind==='nap')a.naps++;}
function doCity(city,when){const list=ACTS[city]||GENERIC_ACTS.map(([t,k])=>[t.replace('{c}',city),k]);
  const n=Math.min(list.length,1+Math.floor(Math.random()*2));const pick=list.slice().sort(()=>Math.random()-0.5).slice(0,n);const out=[];
  pick.forEach(([t,k],idx)=>{collect(k,t);addLog(city+'で '+t,when+idx*60000);out.push(t);});return out;}

function passPerSec(){const u=S.up;return u.station*(1+u.town*0.35)*(1+u.speed*0.2)*(1+0.4*(u.car-1))*0.6;}
function addLog(text,t){S.log.push({t:t||Date.now(),text});if(S.log.length>120)S.log.splice(0,S.log.length-120);}

/* 勤務時間 */
function dayKey(t){return new Date(t).toDateString();}
function workWindow(t){const d=new Date(t);if(!S.work.days.includes(d.getDay()))return null;d.setHours(0,0,0,0);return {st:d.getTime()+S.work.start*60000,en:d.getTime()+S.work.end*60000};}
function inWork(t){const w=workWindow(t);return !!w&&t>=w.st&&t<w.en;}
function workOverlap(t0,t1){if(t1<=t0)return 0;let total=0;const d=new Date(t0);d.setHours(0,0,0,0);
  for(let g=0;g<400&&d.getTime()<t1;g++,d.setDate(d.getDate()+1)){const w=workWindow(d.getTime());if(!w)continue;const a=Math.max(t0,w.st),b=Math.min(t1,w.en);if(b>a)total+=(b-a)/1000;}return total;}
function nextWorkStart(t){for(let d=0;d<21;d++){const w=workWindow(t+d*86400000);if(w&&w.st>t)return w.st;}return t+21*86400000;}
function fmtHM(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}

const MODE_LABEL={train:'電車',shinkansen:'新幹線',flight:'飛行機'};
const ISLANDS=new Set(['札幌','小樽','函館','沖縄']);
function pickAirline(a,b){const l=ROUTES[a+'>'+b];return l&&l.length?l[Math.floor(Math.random()*Math.min(2,l.length))]:null;}
function findHub(a,b){let best=null,bd=1e9;for(const h of CITY_NAMES){if(h===a||h===b)continue;if(ROUTES[a+'>'+h]&&ROUTES[h+'>'+b]){const d=gc(a,h)+gc(h,b);if(d<bd){bd=d;best=[h];}}}
  if(best)return best;
  for(const h1 of CITY_NAMES){if(h1===a||h1===b||!ROUTES[a+'>'+h1])continue;for(const h2 of CITY_NAMES){if(h2===a||h2===b||h2===h1||!ROUTES[h1+'>'+h2]||!ROUTES[h2+'>'+b])continue;const d=gc(a,h1)+gc(h1,h2)+gc(h2,b);if(d<bd){bd=d;best=[h1,h2];}}}
  return best;}
function flightPhases(a,b,dom){const m=Math.round(gc(a,b)/820*60)+25;return [['離陸',5,'fly'],['飛行中',m,'fly'],['着陸',8,'fly']];}
function planLeg(from,to){const km=gc(from,to);const dom=CITIES[from][3]&&CITIES[to][3];let phases,mode,airline=null,via=null;
  if(km<120&&dom){mode='train';const m=Math.round(km/60*60)+5;phases=[['駅へ歩く',10,'walk'],['電車で移動',m,'move'],['駅から街へ',10,'walk']];}
  else if(km<900&&dom&&!ISLANDS.has(from)&&!ISLANDS.has(to)){mode='shinkansen';const m=Math.round(km/230*60)+10;phases=[['駅へ移動',20,'walk'],['駅弁を選ぶ',10,'wait'],['新幹線で移動',m,'move'],['駅から街へ',15,'walk']];}
  else{mode='flight';airline=pickAirline(from,to);
    const pre=[['空港へ移動',50,'walk'],['搭乗手続き',20,'wait'],['保安検査',15,'wait'],['出発ロビーで待つ',35,'wait']];
    const post=(dom?[['到着ロビーへ',10,'walk']]:[['入国審査',25,'wait'],['荷物を受け取る',15,'wait']]).concat([['市内へ移動',40,'walk']]);
    if(airline)phases=pre.concat(flightPhases(from,to,dom),post);
    else{via=findHub(from,to);if(via){airline=pickAirline(from,via[0]);let mid=[];let prev=from;for(const h of via){mid=mid.concat(flightPhases(prev,h,dom),[['乗り継ぎ('+h+')',75,'wait']]);prev=h;}phases=pre.concat(mid,flightPhases(prev,to,dom),post);via=via.join('・');}
      else{airline='経由便';phases=pre.concat(flightPhases(from,to,dom),post);}}}
  const total=phases.reduce((a,p)=>a+p[1],0);return {from,to,km,mode,phases,total,pi:0,ps:0,airline,via};}
function arrive(L,t,r){const j=S.j;j.at=L.to;if(!j.visited.includes(L.to))j.visited.push(L.to);j.leg=null;S.dist+=L.km;const tb=todayBucket();tb.dist+=L.km;tb.places++;
  addLog('「'+L.to+'」に到着('+MODE_LABEL[L.mode]+'で '+fmtDur(L.total*60)+')',t);const acts=doCity(L.to,t+60000);if(r)r.places.push({city:L.to,acts});
  const w=workWindow(t);if(w&&t<w.en&&t>=w.st){j.state='stay';j.until=Math.min(w.en,t+90*60000);}else{j.state='hotel';j.until=0;}}
function decide(t,r){const j=S.j;const w=workWindow(t);
  if(!w||t>=w.en||t<w.st){j.state=j.at===S.home?'home':'hotel';j.until=0;j.morning=true;return;}
  if(j.morning&&j.at!==S.home){j.morning=false;j.state='stay';j.until=Math.min(w.en,t+60*60000);const acts=doCity(j.at,t);if(r)r.places.push({city:j.at,acts});return;}
  j.morning=false;
  const remain=(w.en-t)/60000,allowed=remain+240; // 終業後4時間までは移動が続いてよい
  const others=CITY_NAMES.filter(c=>c!==j.at&&!j.visited.includes(c)&&c!==S.home);
  let cands=others.map(c=>planLeg(j.at,c)).filter(L=>L.total<=allowed);let pick=null;
  if(cands.length){cands.sort((a,b)=>b.total-a.total);pick=cands[Math.floor(Math.random()*Math.min(3,cands.length))];}
  else if(others.length&&remain>=180){const all=others.map(c=>planLeg(j.at,c));all.sort((a,b)=>a.total-b.total);pick=all[0];}
  if(pick&&remain>=60){pick.ps=t;j.leg=pick;j.state='leg';addLog(j.at+'を出発。'+(pick.mode==='flight'&&pick.airline&&pick.airline!=='経由便'?pick.airline+'で':MODE_LABEL[pick.mode]+'で')+(pick.via?pick.via+'経由 ':'')+pick.to+'へ(所要 '+fmtDur(pick.total*60)+')',t);if(r)r.departs.push(pick.to);}
  else{j.state='stay';j.until=w.en;if(j.at!==S.home&&Math.random()<0.7){const acts=doCity(j.at,t);if(r)r.places.push({city:j.at,acts});}}}
function simTo(now,r){const j=S.j;if(!j.t)j.t=now;if(!CITIES[j.at])j.at=S.home;let guard=20000;
  while(j.t<now&&guard--){
    if(j.state==='leg'){const L=j.leg;if(!L){j.state='stay';j.until=j.t;continue;}const ph=L.phases[L.pi],end=L.ps+ph[1]*60000;
      if(end>now){j.t=now;break;}
      L.pi++;L.ps=end;j.t=end;
      if(ph[0]==='搭乗手続き')addLog('空港で搭乗手続きをすませた',end);
      if(ph[0]==='離陸'&&L.pi===L.phases.findIndex(p=>p[0]==='離陸')+1)addLog((L.airline&&L.airline!=='経由便'?L.airline+'の':'')+(L.via?L.via+'経由 ':'')+L.to+'行きの便が離陸',end);else if(ph[0]==='離陸'){const pv=L.phases[L.pi-2];addLog((pv&&pv[0].startsWith('乗り継ぎ')?pv[0].slice(5,-1)+'から':'')+'乗り継ぎ便が離陸',end);}
      if(ph[0]==='着陸'){const nx=L.phases[L.pi];if(nx&&nx[0].startsWith('乗り継ぎ'))addLog(nx[0].slice(5,-1)+'に着陸、乗り継ぎ',end);else addLog(L.to+'に着陸',end);}
      if(ph[0]==='入国審査')addLog('入国審査を通過',end);
      if(L.pi>=L.phases.length)arrive(L,end,r);}
    else{const next=j.state==='stay'?j.until:(inWork(j.t)?j.t:nextWorkStart(j.t));if(next>now){j.t=now;break;}j.t=next;decide(next,r);if(j.state!=='leg'&&j.until<=j.t&&j.state!=='stay'){const nw=nextWorkStart(j.t);if(nw>now){j.t=now;break;}j.t=nw;}}}
  j.t=now;}
function curPhase(){const j=S.j;return j.state==='leg'&&j.leg?j.leg.phases[j.leg.pi]:null;}
function phaseRemain(){const j=S.j;const ph=curPhase();return ph?Math.max(0,(j.leg.ps+ph[1]*60000-Date.now())/1000):0;}
function legRemain(){const j=S.j;if(j.state!=='leg')return 0;let s=phaseRemain();for(let i=j.leg.pi+1;i<j.leg.phases.length;i++)s+=j.leg.phases[i][1]*60;return s;}
function statusText(){const j=S.j,A=S.alt.name;const w=workWindow(Date.now());
  switch(j.state){
    case 'home':return !w?'🏠 今日はお休み。'+A+'は家':(Date.now()<w.st?'🏠 家 · '+fmtHM(S.work.start)+'に出発':'🏠 家');
    case 'hotel':return '🏨 '+j.at+'のホテルで休み';
    case 'stay':return '🚶 '+j.at+'を散歩中';
    case 'leg':{const ph=curPhase();const L=j.leg;const icon=ph[2]==='fly'?'✈':ph[2]==='wait'?'🛂':L.mode==='flight'?'🚶':'🚆';
      return icon+' '+ph[0]+(ph[0]==='飛行中'||ph[0].includes('移動')?' あと'+fmtDur(phaseRemain()):'')+' → '+L.to;}}return '';}
function advance(sec,moneyRate,wallStart){ // 時間を進める(オンライン・オフライン共通)。戻り値は報告
  const r={sec,money:0,dist:0,pass:0,places:[],events:[],departs:[],past:[],workSec:workOverlap(wallStart,wallStart+sec*1000)};
  const money=baseIncome()*sec*moneyRate;gain(money);r.money=money;
  const pp=passPerSec()*sec;S.pass+=pp;r.pass=pp;
  const tb=todayBucket();tb.money+=money;tb.pass+=pp;const d0=S.dist;
  simTo(Date.now(),r);r.dist=S.dist-d0;
  const n=Math.min(6,Math.floor(r.workSec/900));for(let i=0;i<n;i++){const ev=randomEvent(wallStart+((i+0.5)/n)*sec*1000,moneyRate);r.events.push(ev);}
  return r;}

function skyColor(h){const K=[[0,'#0b1236'],[5,'#233366'],[6.5,'#f6b183'],[8,'#8fd0f5'],[16,'#8fd0f5'],[18.2,'#f5a071'],[19.5,'#463a72'],[21,'#0b1236'],[24,'#0b1236']];
  for(let i=0;i<K.length-1;i++){if(h>=K[i][0]&&h<=K[i+1][0]){const t=(h-K[i][0])/(K[i+1][0]-K[i][0]);return lerpC(K[i][1],K[i+1][1],t);}}return K[0][1];}
function lerpC(a,b,t){const pa=hex(a),pb=hex(b);return `rgb(${pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(',')})`;}
function hex(c){if(c[0]==='#')return[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const m=c.match(/\d+/g);return[+m[0],+m[1],+m[2]];}
function nightness(h){if(h<5||h>=20)return 1;if(h<7)return 1-(h-5)/2;if(h>=18)return(h-18)/2;return 0;}
function shade(c,k){const p=hex(c).map(v=>clamp(Math.round(v*k),0,255));return `rgb(${p.join(',')})`;}

function tree(type,x,y,sz,now,i){ // y=地面
  switch(type){
    case 'round':ctx.fillStyle='#6b4a2e';ctx.fillRect(x-1,y-6*sz,2,6*sz);ctx.fillStyle=i%3?'#5f9a4c':'#7ab364';ctx.beginPath();ctx.arc(x,y-8*sz,5*sz,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(x-1.5*sz,y-9.5*sz,2*sz,0,7);ctx.fill();break;
    case 'pine':case 'pinesnow':ctx.fillStyle='#5a3f2a';ctx.fillRect(x-1,y-4,2,4);ctx.fillStyle=type==='pine'?'#3f7a45':'#4a7f52';
      for(let k=0;k<3;k++){const w=(6-k*1.5)*sz,h=y-4-k*4*sz;ctx.beginPath();ctx.moveTo(x-w,h);ctx.lineTo(x,h-6*sz);ctx.lineTo(x+w,h);ctx.fill();}
      if(type==='pinesnow'){ctx.fillStyle='#fff';for(let k=0;k<3;k++){const w=(6-k*1.5)*sz,h=y-4-k*4*sz;ctx.fillRect(x-w*0.6,h-1.5,w*1.2,1.5);}}break;
    case 'palm':{const sway=Math.sin(now/900+i)*1.5;ctx.strokeStyle='#8a6a3a';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+2,y-8*sz,x+sway+3,y-16*sz);ctx.stroke();
      ctx.strokeStyle='#3f9a4a';ctx.lineWidth=1.5;for(let k=0;k<6;k++){const a=-Math.PI/2+(k-2.5)*0.55;ctx.beginPath();ctx.moveTo(x+sway+3,y-16*sz);ctx.quadraticCurveTo(x+sway+3+Math.cos(a)*7*sz,y-16*sz+Math.sin(a)*7*sz-2,x+sway+3+Math.cos(a)*10*sz,y-16*sz+Math.sin(a)*10*sz+4);ctx.stroke();}
      ctx.fillStyle='#6b4a2e';ctx.fillRect(x+sway+1.5,y-15*sz,3,2);break;}
    case 'cactus':ctx.fillStyle='#4f8a4a';ctx.fillRect(x-1.5,y-10*sz,3,10*sz);ctx.fillRect(x-5,y-7*sz,3.5,1.5);ctx.fillRect(x-5,y-7*sz,1.5,4);ctx.fillRect(x+1.5,y-5*sz,3.5,1.5);ctx.fillRect(x+3.5,y-5*sz,1.5,3);break;
  }}
function building(style,b,pal,night,now){const x=b.x,w=b.w,h=b.h,y=GY;const c=pal[b.ci%pal.length];
  const win=(wx,wy,ww,wh,lit)=>{ctx.fillStyle=lit?'#ffd98a':'rgba(50,60,80,.65)';ctx.fillRect(wx,wy,ww,wh);};
  const lit=(k)=>night>0.3&&rnd(x*3+k*7)>0.4&&Math.sin(now/1700+b.ph*9+k)>-0.85;
  switch(style){
    case 'tall':ctx.fillStyle=c;ctx.fillRect(x,y-h,w,h);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x,y-h,w,2);
      {const cols=Math.max(1,Math.floor((w-3)/4)),rows=Math.max(1,Math.floor((h-4)/6));for(let r=0;r<rows;r++)for(let k=0;k<cols;k++)win(x+2+k*4,y-h+4+r*6,2,3,lit(r*7+k));}break;
    case 'house':case 'snowhouse':case 'cabin':{const hh=Math.min(h,18),ww=Math.max(w,12);ctx.fillStyle=style==='cabin'?'#7a5a3a':c;ctx.fillRect(x,y-hh,ww,hh);
      ctx.fillStyle=style==='snowhouse'?'#fff':style==='cabin'?'#4d3a26':['#b35a4a','#8a5a4a','#6f7f8f','#a0604a'][b.ci%4];ctx.beginPath();ctx.moveTo(x-2,y-hh);ctx.lineTo(x+ww/2,y-hh-7);ctx.lineTo(x+ww+2,y-hh);ctx.fill();
      ctx.fillStyle='#6b4a3a';ctx.fillRect(x+ww-4,y-hh-6,2,4);
      if(Math.sin(now/1300+b.ph*10)>0.6){ctx.fillStyle='rgba(240,240,245,.55)';ctx.beginPath();ctx.arc(x+ww-3+Math.sin(now/500)*1,y-hh-9-((now/60+b.ph*100)%8),1.6,0,7);ctx.fill();}
      win(x+2,y-hh+4,3,3,lit(1));if(ww>14)win(x+ww-5,y-hh+4,3,3,lit(2));ctx.fillStyle='#5a3f2a';ctx.fillRect(x+ww/2-1.5,y-5,3,5);break;}
    case 'hut':{const hh=Math.min(h,12),ww=Math.max(w,10);ctx.fillStyle=c;ctx.fillRect(x,y-hh,ww,hh);ctx.fillStyle='#8a7a4a';ctx.beginPath();ctx.moveTo(x-3,y-hh);ctx.lineTo(x+ww/2,y-hh-6);ctx.lineTo(x+ww+3,y-hh);ctx.fill();
      ctx.fillStyle='#a08a55';ctx.fillRect(x-3,y-hh-1,ww+6,1.5);win(x+ww/2-1.5,y-hh+3,3,3,lit(1));break;}
    case 'adobe':{const hh=Math.min(h,16),ww=Math.max(w,12);ctx.fillStyle=c;ctx.fillRect(x,y-hh,ww,hh);ctx.fillStyle=shade(c,0.85);ctx.fillRect(x+2,y-hh-3,ww-4,3);win(x+3,y-hh+4,2,3,lit(1));win(x+ww-5,y-hh+4,2,3,lit(2));break;}
    case 'ruin':{ctx.fillStyle=c;const ww=Math.max(w,10);for(let k=0;k<3;k++)ctx.fillRect(x+k*(ww/3),y-4-rnd(b.ph*7+k)*8,ww/3-1,4+rnd(b.ph*7+k)*8);break;}
  }}

function drawFar(B,name,now,night,hr){

    case 'hills':ctx.fillStyle=B.hill2;for(let i=0;i<9;i++){const hx=i*LW/7-20;ctx.beginPath();ctx.arc(hx+40,GY+8,36+rnd(i*5)*22,Math.PI,0);ctx.fill();}

        ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(cx-26,GY+4-bh+22);ctx.lineTo(cx-10,GY+4-bh);ctx.lineTo(cx+10,GY+4-bh);ctx.lineTo(cx+26,GY+4-bh+22);ctx.lineTo(cx+16,GY+4-bh+18);ctx.lineTo(cx+6,GY+4-bh+24);ctx.lineTo(cx-4,GY+4-bh+17);ctx.lineTo(cx-14,GY+4-bh+24);ctx.fill();}break;

      ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<14;i++){const wx=(i*LW/12+now/40*(1+rnd(i)*0.5))%(LW+40)-20,wy=top+6+rnd(i*3)*20;ctx.fillRect(wx,wy+Math.sin(now/600+i)*0.8,8+rnd(i*5)*10,1);}
      if(night<0.5){ctx.fillStyle='rgba(255,240,200,.25)';ctx.fillRect(LW*0.1+(LW*0.8)*clamp((hr-6)/12,0,1)-8,top,16,GY-top);}
      const bx=(now/150)%(LW+60)-30;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(bx,top+12);ctx.lineTo(bx,top+3);ctx.lineTo(bx+7,top+11);ctx.fill();ctx.fillStyle='#7a4a2a';ctx.fillRect(bx-4,top+12,11,2.5);
      if(name==='ハワイ'){ctx.fillStyle='#6d7f5e';ctx.beginPath();ctx.moveTo(LW*0.55,top+1);ctx.lineTo(LW*0.62,top-18);ctx.lineTo(LW*0.7,top-14);ctx.lineTo(LW*0.8,top+1);ctx.fill();
        if(night<0.4){ctx.lineWidth=2;['#ff6b6b','#ffd166','#8ce99a','#74c0fc','#b197fc'].forEach((c,k)=>{ctx.strokeStyle=c;ctx.globalAlpha*=1;ctx.beginPath();ctx.arc(LW*0.3,top+30,60-k*2.4,Math.PI*1.05,Math.PI*1.95);ctx.stroke();});}}
      if(name==='シドニー'){ctx.fillStyle='#f4f4f0';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(LW*0.2+k*14,top+1);ctx.quadraticCurveTo(LW*0.2+k*14+6,top-14,LW*0.2+k*14+16,top-2);ctx.lineTo(LW*0.2+k*14+14,top+1);ctx.fill();}}

    case 'skyline':{ctx.fillStyle=shade(B.hill2,0.9);for(let i=0;i<26;i++){const bw=10+rnd(i*3)*16,bh=15+rnd(i*5+1)*55,bx=i*LW/24-10;ctx.fillRect(bx,GY+4-bh,bw,bh);
        if(night>0.3){ctx.fillStyle='rgba(255,220,140,.7)';for(let r=0;r<Math.floor(bh/7);r++)for(let k=0;k<Math.floor(bw/5);k++)if(rnd(i*11+r*3+k)>0.5)ctx.fillRect(bx+2+k*5,GY+8-bh+r*7,1.5,2);ctx.fillStyle=shade(B.hill2,0.9);}}
      ctx.fillStyle=B.hill;for(let i=0;i<14;i++){const bw=14+rnd(i*7)*20,bh=10+rnd(i*9+1)*28,bx=i*LW/12-10;ctx.fillRect(bx,GY+4-bh,bw,bh);}
      if(name==='ニューヨーク'){ctx.fillStyle='#7f9a8f';const sx=LW*0.7;ctx.fillRect(sx-4,GY-30,8,34);ctx.fillRect(sx-1.5,GY-52,3,22);ctx.fillRect(sx-6,GY-48,12,2);ctx.fillRect(sx+2,GY-62,1.5,14);}break;}
    case 'oldtown':{ctx.fillStyle=B.hill2;for(let i=0;i<9;i++){const hx=i*LW/7-20;ctx.beginPath();ctx.arc(hx+40,GY+8,30+rnd(i*5)*18,Math.PI,0);ctx.fill();}
      ctx.fillStyle='#8f7f75';for(let i=0;i<22;i++){const bw=12+rnd(i*3)*14,bh=10+rnd(i*5+1)*16,bx=i*LW/20-10;ctx.fillRect(bx,GY+4-bh,bw,bh);ctx.fillStyle='#6f5a55';ctx.beginPath();ctx.moveTo(bx-1,GY+4-bh);ctx.lineTo(bx+bw/2,GY-bh-3);ctx.lineTo(bx+bw+1,GY+4-bh);ctx.fill();ctx.fillStyle='#8f7f75';}

    case 'earth':{ctx.fillStyle='#000814';ctx.fillRect(0,0,LW,GY+4);ctx.fillStyle='#fff';for(let i=0;i<120;i++){ctx.globalAlpha*=1;ctx.fillRect(rnd(i*11)*LW,rnd(i*13)*GY,1,1);}
      const ex=LW*0.7,ey=60;ctx.fillStyle='#2b6fd6';ctx.beginPath();ctx.arc(ex,ey,26,0,7);ctx.fill();ctx.fillStyle='#4caf50';ctx.beginPath();ctx.arc(ex-8,ey-4,9,0,7);ctx.fill();ctx.beginPath();ctx.arc(ex+9,ey+8,7,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(ex+6,ey-12,5,0,7);ctx.fill();ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.arc(ex+10,ey,26,-Math.PI/2,Math.PI/2);ctx.fill();break;}

function drawGroundDetail(B,name,now,night){
  ctx.fillStyle=B.ground;ctx.fillRect(0,GY,LW,LH-GY);ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,GY,LW,2);
  if(B.far==='earth'){ctx.fillStyle='rgba(0,0,0,.18)';for(let i=0;i<14;i++){ctx.beginPath();ctx.ellipse(rnd(i*17+3)*LW,GY+10+rnd(i*19+5)*70,4+rnd(i)*8,2+rnd(i*2)*3,0,0,7);ctx.fill();}return;}
  // 草花・砂・雪
  if(B.tree==='round'||B.tree==='pine'){ctx.fillStyle=shade(B.hill,0.95);for(let i=0;i<40;i++){const gx=rnd(i*17+3)*LW,gy=GY+20+rnd(i*19+5)*28;ctx.fillRect(gx,gy,1.5,3);ctx.fillRect(gx+2,gy+1,1.5,2);}
    for(let i=0;i<16;i++){ctx.fillStyle=['#ff8fa3','#ffd166','#fff','#c4b5fd'][i%4];ctx.fillRect(rnd(i*23+9)*LW,GY+22+rnd(i*29+5)*24,1.5,1.5);}}
  if(B.far==='sea'||B.far==='dunes'){ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<50;i++)ctx.fillRect(rnd(i*17+3)*LW,GY+8+rnd(i*19+5)*40,1,1);
    if(B.far==='sea'){ctx.fillStyle='#f7f2e2';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(rnd(i*31+7)*LW,GY+28+rnd(i*37+5)*16,1.5,0,7);ctx.fill();}}}
  if(B.tree==='pinesnow'){ctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<30;i++)ctx.fillRect(rnd(i*17+3)*LW,GY+6+rnd(i*19+5)*40,3,1.5);}

  ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(0,TY-2,LW,12);ctx.fillStyle='rgba(0,0,0,.15)';for(let x=6;x<LW;x+=9)ctx.fillRect(x,TY-2,1.5,3);

}
function drawScene(bn,name,alpha,now,night,hr){const B=BIOMES[bn];ctx.globalAlpha=alpha;
  drawFar(B,name,now,night,hr);drawGroundDetail(B,name,now,night);
  // 木
  for(let i=0;i<B.trees;i++){const tx=rnd(i*13+2)*LW,ty=GY+4+rnd(i*7+1)*10;tree(B.tree,tx,ty,0.8+rnd(i*3)*0.5,now,i);}
  // 建物
  if(B.build!=='none')for(const b of buildings)building(B.build,b,B.pal,night,now);
  // 天候・生きもの
  if(bn==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';for(const f of flakes){const fx=(f.x+Math.sin(now/700+f.ph)*6)%LW,fy=(f.y+now/1000*f.v)%LH;ctx.fillRect(fx,fy,1.5,1.5);}}
  if(B.far==='sea'){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;for(const g of gulls){const gx=(g.x+now/1000*g.v)%(LW+40)-20,gy=g.y+Math.sin(now/500+g.ph)*3,fl=Math.sin(now/150+g.ph)*2;ctx.beginPath();ctx.moveTo(gx-4,gy-fl);ctx.lineTo(gx,gy);ctx.lineTo(gx+4,gy-fl);ctx.stroke();}}
  if(night>0.5&&(bn==='town'||bn==='mountain')){ctx.fillStyle='rgba(255,240,150,.8)';for(let i=0;i<10;i++){const a=Math.sin(now/600+i*2.1);if(a>0.3)ctx.fillRect(rnd(i*41+3)*LW,GY+20+rnd(i*43+7)*20+Math.sin(now/900+i)*3,1.5,1.5);}}
  ctx.globalAlpha=1;}

function draw(dt,now){const d=new Date();const hr=d.getHours()+d.getMinutes()/60;const night=nightness(hr);
  const sc=sceneState();
  ctx.setTransform(z,0,0,z,0,0);ctx.imageSmoothingEnabled=false;
  // 空
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,skyColor(hr));g.addColorStop(1,lerpC(skyColor(hr),'#ffffff',0.28*(1-night)));
  ctx.fillStyle=g;ctx.fillRect(0,0,LW,GY+2);
  if(night>0){ctx.fillStyle=`rgba(255,255,255,${0.8*night})`;for(let i=0;i<50;i++){const sx=rnd(i*11)*LW,sy=rnd(i*13)*110;if(Math.sin(now/400+i)>-0.3)ctx.fillRect(sx,sy,1.2,1.2);}}
  const ang=((hr-6)/12)*Math.PI;const sx=LW*0.1+(LW*0.8)*((hr-6)/12),sy=140-Math.sin(ang)*120;
  if(hr>5.5&&hr<18.5){ctx.fillStyle='rgba(255,236,170,.35)';ctx.beginPath();ctx.arc(sx,sy,14,0,7);ctx.fill();ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(sx,sy,9,0,7);ctx.fill();}
  else{const mh=(hr>=18?hr-18:hr+6);const mx=LW*0.1+(LW*0.8)*(mh/12),my=140-Math.sin(mh/12*Math.PI)*120;ctx.fillStyle='#e8ecff';ctx.beginPath();ctx.arc(mx,my,7,0,7);ctx.fill();ctx.fillStyle=skyColor(hr);ctx.beginPath();ctx.arc(mx+3,my-2,6,0,7);ctx.fill();}
  for(const c of clouds){c.x-=c.v*dt;if(c.x<-80)c.x=LW+40;ctx.fillStyle=`rgba(255,255,255,${0.9-0.55*night})`;
    ctx.fillRect(c.x,c.y,30*c.s,8*c.s);ctx.fillRect(c.x+6*c.s,c.y-5*c.s,16*c.s,6*c.s);ctx.fillRect(c.x+20*c.s,c.y-3*c.s,10*c.s,4*c.s);}
  // 風景(前の街→次の街へゆっくり切り替え)
  drawScene(sc.prev,sc.prevName,1,now,night,hr);
  if(sc.f>0)drawScene(sc.next,sc.nextName,sc.f,now,night,hr);
  // 線路
  ctx.fillStyle='#5a4632';for(let x=0;x<LW;x+=7)ctx.fillRect(x,TY+3,4,5);
  ctx.fillStyle='#9aa0a8';ctx.fillRect(0,TY+3,LW,1.2);ctx.fillRect(0,TY+6.5,LW,1.2);
  // 駅
  ctx.font='6px monospace';
  stations.forEach((s,i)=>{const px=s.x-22;ctx.fillStyle='#d8d0c0';ctx.fillRect(px,TY-4,44,4);ctx.fillStyle='#8a4b3b';ctx.fillRect(px+2,TY-22,40,3);
    ctx.fillStyle='#6b6b6b';ctx.fillRect(px+4,TY-19,1.5,15);ctx.fillRect(px+38.5,TY-19,1.5,15);
    ctx.fillStyle='#fff';ctx.fillRect(px+14,TY-16,16,6);ctx.fillStyle='#223';ctx.fillText((i+1)+'駅',px+16,TY-11);
    if(i===0){ctx.fillStyle='#e9a23b';ctx.fillRect(px+34,TY-8,4,3);ctx.fillRect(px+33,TY-9,1.5,1.5);ctx.fillRect(px+38,TY-10,1,3);} // 駅のねこ
    for(let k=0;k<Math.min(6,s.wait);k++){const bob=Math.sin(now/300+k*1.7+i)*0.6;const wx=px+7+k*5.5,wy=TY-11+bob;
      ctx.fillStyle=['#e76f51','#2a9d8f','#e9c46a','#8ecae6','#f4a261','#cdb4db'][(k+i)%6];ctx.fillRect(wx,wy,3,5);ctx.fillStyle='#f1d3b3';ctx.fillRect(wx,wy-3,3,3);}
    if(s.tip){const t=s.tip;const bx=s.x+14,by=TY-13+Math.sin(now/120)*1.2;
      ctx.fillStyle=t.golden?'#ffcc4d':'#ff5d8f';ctx.fillRect(bx,by,4,6);ctx.fillStyle='#f1d3b3';ctx.fillRect(bx,by-4,4,4);
      ctx.fillStyle='#fff';ctx.fillRect(bx-1,by-16,7,9);ctx.fillStyle=t.golden?'#d48a00':'#d6336c';ctx.font='bold 8px monospace';ctx.fillText('!',bx+1,by-9);ctx.font='6px monospace';
      const rem=(t.until-now)/8000;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx-4,by-19,12,1.5);ctx.fillStyle=t.golden?'#ffcc4d':'#6ee7a1';ctx.fillRect(bx-4,by-19,12*Math.max(0,rem),1.5);}});
  // 列車
  const cars=S.up.car,cw=18,gap=3,lw=26;const TL=lw+cars*(cw+gap);
  const tx=train.x;const loco=S.golden?'#e6b422':'#b8312f',locoD=S.golden?'#a67c00':'#7a1f1e';
  for(let k=0;k<cars;k++){const cx=tx+lw+gap+k*(cw+gap);ctx.fillStyle=S.golden?'#f2d77a':'#2d6a9f';ctx.fillRect(cx,TY-12,cw,11);
    ctx.fillStyle='#dff';for(let w=0;w<3;w++)ctx.fillRect(cx+2+w*5.5,TY-10,3.5,4);ctx.fillStyle='#222';ctx.fillRect(cx+3,TY-1,3,3);ctx.fillRect(cx+cw-6,TY-1,3,3);
    if(k===cars-1&&!sc.flying){ // もう1人の自分が窓から手を振る(飛行中は不在)
      const wx=cx+13,wy=TY-10;ctx.fillStyle='#f1d3b3';ctx.fillRect(wx,wy,3,3);ctx.fillStyle='#5a3a2a';ctx.fillRect(wx,wy-1,3,1.2);
      const wave=Math.sin(now/180)*1.5;ctx.fillStyle='#f1d3b3';ctx.fillRect(wx+3.5,wy-2+wave,1.2,3);}}
  ctx.fillStyle=loco;ctx.fillRect(tx,TY-13,lw,12);ctx.fillStyle=locoD;ctx.fillRect(tx+14,TY-19,10,7);ctx.fillStyle='#222';ctx.fillRect(tx+4,TY-22,4,9);
  ctx.fillStyle='#ffef9a';ctx.fillRect(tx-1,TY-9,2,3);ctx.fillStyle='#dff';ctx.fillRect(tx+16,TY-17,6,4);
  ctx.fillStyle='#222';ctx.fillRect(tx+3,TY-1,4,4);ctx.fillRect(tx+11,TY-1,4,4);ctx.fillRect(tx+19,TY-1,4,4);
  train.box={x:tx,y:TY-24,w:TL,h:28};
  // 飛行機(飛行中はもう1人の自分は空の上)
  if(sc.flying){const px=20+(LW-40)*sc.t,py=34+Math.sin(now/1400)*2;ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(px-40,py+1,36,1.2);ctx.fillRect(px-70,py+1,22,0.8);
    ctx.fillStyle='#f4f6fa';ctx.fillRect(px-8,py,16,3);ctx.beginPath();ctx.moveTo(px+8,py);ctx.lineTo(px+12,py+1.5);ctx.lineTo(px+8,py+3);ctx.fill();ctx.fillStyle='#c94b4b';ctx.fillRect(px-8,py-3,2,3);ctx.fillStyle='#dfe4ec';ctx.fillRect(px-3,py+3,6,2);ctx.fillRect(px-2,py-2,5,2);
    ctx.fillStyle='#6a8fb5';for(let k=0;k<4;k++)ctx.fillRect(px-5+k*3,py+0.8,1.5,1);}
  // つぶやき
  if(now>bubble.until+bubble.next&&tx>20&&tx+TL<LW-20){const ph=curPhase();const pool=S.j.state==='home'?(workWindow(Date.now())?PHRASES.home:PHRASES.off):S.j.state==='hotel'?PHRASES.hotel:ph&&ph[2]==='fly'?PHRASES.fly:ph&&ph[2]==='wait'?PHRASES.wait:(PHRASES[sc.f>0.5?sc.next:sc.prev]||[]).concat(PHRASES.any);bubble={text:pool[Math.floor(Math.random()*pool.length)],until:now+3500,next:20000+Math.random()*25000};}
  if(now<bubble.until){const bx=sc.flying?20+(LW-40)*sc.t:tx+TL-12,by=sc.flying?22:TY-30;ctx.font='7px sans-serif';const w=ctx.measureText(bubble.text).width+8;ctx.fillStyle='rgba(255,255,255,.92)';ctx.fillRect(bx-w/2,by-9,w,11);ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.moveTo(bx-2,by+2);ctx.lineTo(bx+2,by+2);ctx.lineTo(bx,by+5);ctx.fill();ctx.fillStyle='#334';ctx.textAlign='center';ctx.fillText(bubble.text,bx,by);ctx.textAlign='left';}
  // 次の街の標識
  {ctx.font='6px sans-serif';const txt=S.j.state==='leg'?'→ '+sc.nextName:S.j.state==='home'?'🏠 '+S.home+'の家':'📍 '+S.j.at;const w=ctx.measureText(txt).width+6;const px=LW-w-10;ctx.fillStyle='#6b4a2e';ctx.fillRect(px+w/2-1,TY-14,2,10);ctx.fillStyle='#f5efe0';ctx.fillRect(px,TY-20,w,8);ctx.fillStyle='#334';ctx.fillText(txt,px+3,TY-14);}
  // 煙
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.x+=8*dt;p.y-=12*dt;p.r+=6*dt;p.a-=0.5*dt;if(p.a<=0){puffs.splice(i,1);continue;}
    ctx.fillStyle=`rgba(235,235,240,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  // ポップ
  ctx.font='bold 8px monospace';ctx.textAlign='center';
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;if(p.t>1.4){pops.splice(i,1);continue;}
    ctx.globalAlpha=1-p.t/1.4;ctx.fillStyle='#000';ctx.fillText(p.text,p.x+0.6,p.y-p.t*18+0.6);ctx.fillStyle=p.col;ctx.fillText(p.text,p.x,p.y-p.t*18);ctx.globalAlpha=1;}
  ctx.textAlign='left';
  if(train.whistle>0){train.whistle-=dt;ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.fillText('ポーッ!',tx+2,TY-28);}
}

/* ========== 更新 ========== */
let last=performance.now(),hudT=0;
let sinceEvent=0,nextEvent=150+Math.random()*150;
function frame(t){const dt=Math.min(0.1,(t-last)/1000);last=t;const now=t;
  // タブが裏に回っていた等で時間が飛んだら、その分を進める
  const wall=Date.now();const gap=(wall-S.lastTick)/1000;S.lastTick=wall;
  if(gap>2){const eff=Math.min(gap,8*3600);const r=advance(eff,1,wall-eff*1000);
    if(eff>60){S.log.sort((a,b)=>a.t-b.t);showReport(r);}
    else if(r.places.length){const lp=r.places[r.places.length-1];toast(S.alt.name+'は'+lp.city+'で'+lp.acts[0],'var(--acc)');}
    save();}
  // income
  const inc=income()*dt;gain(inc);train.acc+=inc;
  {const tb=todayBucket();tb.money+=inc;const pp=passPerSec()*dt;S.pass+=pp;tb.pass+=pp;const working=inWork(wall);
   const rr={places:[],departs:[]};const st0=S.j.state,pi0=S.j.leg?S.j.leg.pi:-1;simTo(wall,rr);
   if(rr.places.length){const lp=rr.places[rr.places.length-1];pop(LW/2,60,'「'+lp.city+'」に到着!','#ffcc4d');toast(S.alt.name+'は'+lp.city+'で'+lp.acts[0],'var(--acc)');if(tab==='log')renderPanel();}
   else if(rr.departs.length){toast(S.alt.name+'が'+rr.departs[0]+'へ出発','var(--ad)');if(tab==='log')renderPanel();}
   else if(S.j.state==='leg'&&(st0!=='leg'||S.j.leg.pi!==pi0)){const ph=curPhase();if(ph)toast(ph[0]+(ph[0]==='飛行中'?'('+fmtDur(ph[1]*60)+')':''),'var(--dim)');}
   {const w=workWindow(wall);if(w&&wall>=w.en&&S.j.dayReported!==dayKey(wall)&&S.total>1000){S.j.dayReported=dayKey(wall);showReport({sec:0,money:0,dist:0,pass:0,places:[],events:[],departs:[],past:[],workSec:0,dayEnd:true});save();}}
   sinceEvent+=dt;if(working&&sinceEvent>nextEvent){sinceEvent=0;nextEvent=150+Math.random()*150;const ev=randomEvent(Date.now(),1);pop(LW/2,50,ev.text,'#dff');if(tab==='log')renderPanel();}}
  // train movement
  const speed=55+S.up.speed*12;const cars=S.up.car,TL=26+cars*21;
  if(train.dwell>0){train.dwell-=dt;}
  else{train.x-=speed*dt;
    if(Math.random()<dt*4){puffs.push({x:train.x+6,y:TY-22,r:2,a:0.7});}
    stations.forEach((s,i)=>{if(train.lastStop!==i&&train.x<=s.x-13&&train.x>s.x-13-speed*dt-1){train.lastStop=i;train.dwell=1.1;S.trips++;
      if(train.acc>0.5){pop(s.x,TY-30,'+¥'+fmt(train.acc),'#ffe27a');train.acc=0;}s.wait=Math.max(0,s.wait-2);}});
    if(train.x+TL<-10){train.x=LW+20;train.lastStop=-1;}}
  stations.forEach(s=>{if(Math.random()<dt*0.4&&s.wait<2+S.up.town*0.3)s.wait++;});
  // tips (only while visible)
  sinceTip+=dt;
  if(document.visibilityState==='visible'&&sinceTip>7+Math.random()*8){sinceTip=0;const s=stations[Math.floor(Math.random()*stations.length)];
    if(!s.tip)s.tip={until:now+8000,golden:Math.random()<0.06};}
  stations.forEach(s=>{if(s.tip&&now>s.tip.until)s.tip=null;});
  draw(dt,now);
  hudT+=dt;if(hudT>0.15){hudT=0;$('money').textContent='¥'+fmt(S.money);$('rate').textContent='+'+fmt(income())+'/秒';
    const m=mults();$('watch').className='badge'+(m.watch>1?' on':'');$('watch').textContent=m.watch>1?'見守り中 ×1.5':'放置中 ×1';
    $('boost').classList.toggle('hidden',m.boost<=1);$('region').textContent=REGIONS[Math.min(S.stars,REGIONS.length-1)].name+(S.stars?' ★'+S.stars:'');$('dist').textContent=statusText();
    if(tab==='build'||tab==='shop'){panel.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.disabled=S.up[k]>=MAX[k]||S.money<cost(k);});const bp=$('bPrestige');if(bp)bp.disabled=S.total<prestigeNeed();}}
  requestAnimationFrame(frame);}

/* 入力 */
addEventListener('mousemove',()=>lastActive=performance.now());
addEventListener('keydown',()=>lastActive=performance.now());
addEventListener('pointerdown',()=>lastActive=performance.now());
cv.addEventListener('click',e=>{lastActive=performance.now();const x=e.clientX/z,y=e.clientY/z;const now=performance.now();
  for(const s of stations){if(s.tip){const bx=s.x+14,by=TY-13;if(x>bx-8&&x<bx+12&&y>by-22&&y<by+8){const g=s.tip.golden?income()*90:Math.max(20,income()*8);gain(g);S.tips++;
    pop(bx,by-20,(s.tip.golden?'大チップ ':'チップ ')+'+¥'+fmt(g),s.tip.golden?'#ffcc4d':'#ff8fb1');s.tip=null;save();return;}}}
  const b=train.box;if(b&&x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h){if(now-(train.lastWhistle||0)>5000){train.lastWhistle=now;train.whistle=0.8;const g=income()*3;gain(g);pop(b.x+13,TY-36,'+¥'+fmt(g),'#fff');
    for(let i=0;i<4;i++)puffs.push({x:train.x+6,y:TY-24,r:3,a:0.8});}}});
setInterval(save,5000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});

resize();for(let i=0;i<Math.min(S.up.town,60);i++)addBuilding();train.x=LW+20;
if(!S.setup)showSetup();else if(report)showReport(report);
requestAnimationFrame(frame);
</script>
