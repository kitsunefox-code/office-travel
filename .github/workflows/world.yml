name: world
on:
  schedule:
    - cron: "30 19 * * *"   # 毎日 04:30 JST: 外務省の安全情報と国の情報
    - cron: "0 19 * * 2"    # 水曜 04:00 JST: Wikivoyage の掲載も取り直す
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch overseas info
        run: |
          if [ "${{ github.event.schedule }}" = "30 19 * * *" ]; then python tools/fetch_world.py --safety-only; else python tools/fetch_world.py; fi
      - name: Commit data
        run: |
          git config user.name "world-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/world.json data/wv
          if git diff --cached --quiet; then echo "no change"; else git commit -m "world: update $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase --autostash && git push; fi
