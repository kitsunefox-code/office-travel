name: flights
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flights
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch flights from Travelpayouts
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: python tools/fetch_flights.py
      - name: Commit data
        run: |
          git config user.name "flights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/flights
          if git diff --cached --quiet; then echo "no change"; else git commit -m "flights: update $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
