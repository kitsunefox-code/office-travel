name: season
# 気象庁の生物季節観測(さくら・かえで・いちょう)を毎朝取り込む。鍵は不要。
on:
  schedule:
    - cron: '30 0 * * *'   # 09:30 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_season.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/season.json
          git diff --cached --quiet || (git commit -m "season: 生物季節観測を更新" && git push)
