<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オフィストラベル</title>
<meta name="theme-color" content="#f6efe2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="オフィストラベル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#faf6ee;--paper2:#f1ebdf;--line:#e3dccb;--ink:#2a2f3a;--ink2:#5b6270;--dim:#8a9099;
    --acc:#d9773b;--acc2:#f2c9ab;--ok:#3f8f5f;--ng:#c8503c;--info:#3a78b5;--gold:#b8860b;
    --map:#f3efe6;--shadow:0 6px 24px rgba(40,30,10,.14),0 1px 3px rgba(40,30,10,.10);
    --fd:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;--fb:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--map);color:var(--ink);font:13px/1.5 var(--fb);overflow:hidden;user-select:none}
  #basemap{position:absolute;inset:0;background:var(--map)}
  #basemap .maplibregl-ctrl-attrib{font-size:9px;opacity:.75}
  #map{position:absolute;left:0;top:0;right:0;bottom:0;display:block;pointer-events:none;background:transparent}
  #field{display:block;width:100%;height:200px;border-radius:12px;cursor:pointer;background:#6b8f4e;touch-action:manipulation}
  #dlg{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.98);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:9}
  #dlg.hidden{display:none}
  #dlg .q{font:700 14px/1.4 var(--fd);margin-bottom:8px}
  #dlg input,#dlg textarea{width:100%;box-sizing:border-box;padding:9px 10px;font:500 14px var(--fb);border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  #dlg .opts{display:flex;gap:6px;margin-top:8px}
  #dlg .opts button{padding:8px 14px;font-size:13px}
  @media (max-width:760px){#dlg{bottom:calc(60px + env(safe-area-inset-bottom))}}
  #ask,#poiCard{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:4}
  #ask .q,#poiCard .q{font:700 16px/1.3 var(--fd);margin-bottom:4px;display:flex;align-items:center;gap:8px}#poiCard .q .em{display:inline-flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;font-size:16px;flex:none}
  #ask .opts,#poiCard .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  #ask .opts button,#poiCard .opts button{padding:8px 12px;font-size:13px}
  #ask .ttl{color:var(--dim);font-size:11px;margin-top:6px}
  .bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
  /* 家のシーン */
  #home{position:absolute;inset:0;background:#efe6d6;overflow:hidden}
#homeDock{display:none}
@media (max-width:760px){
  #home:not(.hidden){display:flex;flex-direction:column}
  #home #room{position:relative;inset:auto;flex:1;min-height:0}
  #homeDock{display:block;flex:none;position:relative;z-index:7;padding:12px 10px 10px;background:#f6efe2;border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(40,30,10,.12);margin-top:-18px}
  #homeDock::before{content:'';position:absolute;left:50%;top:5px;width:36px;height:4px;border-radius:2px;background:#e0d6c3;transform:translateX(-50%)}
  #fieldHome{position:static!important;display:block;width:100%!important;height:84px!important;margin-top:9px;border-radius:14px}
  .roomBar{display:none!important}
  #ov .memo.tap[data-open="map"]{display:none}
  .rideCard{bottom:24px!important}
  body.vhome #ask{bottom:calc(52px + var(--dockH,250px) + 6px + env(safe-area-inset-bottom))}
  body.vhome #toast{bottom:calc(52px + var(--dockH,250px) + 10px + env(safe-area-inset-bottom))!important}
}
.dp{width:100%;display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 16px;border:0;border-radius:18px;background:linear-gradient(135deg,#e08a5f,#d9704a);color:#fff;box-shadow:0 6px 16px rgba(217,112,74,.38),inset 0 1px 0 rgba(255,255,255,.25);text-align:left;cursor:pointer;transition:transform .12s}
.dp:active{transform:scale(.97)}.dp.calm{background:linear-gradient(135deg,#3b4254,#2a2f3a);box-shadow:0 6px 16px rgba(42,47,58,.35)}
.dp .di{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center}.dp .di svg{width:22px;height:22px}
.dp .dtx{flex:1;min-width:0;display:flex;flex-direction:column}.dp .dtx b{font:700 17px/1.2 var(--fd);letter-spacing:.02em}.dp .dtx small{font:500 11.5px/1.35 var(--fb);opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dp .chev{font:700 26px/1 var(--fd);opacity:.7}
.dprow{display:flex;gap:8px}.dprow .dp{flex:1;min-width:0}
.dhome{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(40,30,10,.12);cursor:pointer;border:1px solid var(--line)}.dhome span{display:inline-flex;color:var(--acc)}.dhome svg{width:24px;height:24px}.dhome b{font:700 11px/1.1 var(--fd)}.dhome:active{transform:scale(.95)}
.dts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:9px}
.dt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:8px 4px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 2px 6px rgba(40,30,10,.06);cursor:pointer;transition:transform .12s}
.dt:active{transform:scale(.95)}.dt .di{color:var(--acc);display:inline-flex}.dt .di svg{width:24px;height:24px}.dt .dlb{font:600 10.5px/1.2 var(--fb);color:var(--dim);white-space:nowrap}.dt b{font:700 13px/1.2 var(--fd);color:var(--ink);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt em{position:absolute;top:6px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font:700 11px/18px var(--fb);font-style:normal;padding:0 5px;box-sizing:border-box}
  #home.hidden{display:none}
  #room{position:absolute;inset:0}
  #fieldHome{display:none;position:absolute;left:8px;width:calc(100% - 16px);bottom:8px;height:132px;border-radius:14px;box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.7);cursor:pointer;touch-action:manipulation}
  @media (max-width:760px){#fieldHome{display:block}}
  body.vhome #basemap,body.vhome #map{opacity:0;pointer-events:none}
  
  body.vhome #hfoot,body.vhome #bViewHome,body.vhome #poiCard{display:none!important}
  .room .bubble{font-size:1.05em;padding:.55em .8em;border-radius:1em}
  .room .bubble:after{left:45%}
  .room .memo{font-size:.95em}
  .room .memo button{font:500 .85em/1.2 var(--fb);padding:.35em .6em;margin:.2em .2em 0 0;border-radius:.45em}
  .room .memo .q{font:700 1.05em var(--fd);margin-bottom:.15em}
  .room .tag{font-size:.95em}
  .charTap{position:absolute;cursor:pointer}
  .goTag{background:var(--acc);color:#fff;border-radius:.6em;padding:.5em .8em;font:700 .95em/1.2 var(--fd);white-space:nowrap;box-shadow:0 .25em .5em rgba(0,0,0,.22)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chips button{padding:6px 11px;border-radius:999px;font-size:13px;background:#fff}.chips button:disabled{opacity:.45}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}.grid3 button{padding:12px 6px;border-radius:12px;background:#fff;font-size:13px;line-height:1.3}.grid3 button i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
  .row>div>small{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:2px;font-weight:400}
  .row>div:first-child{font-weight:600;color:var(--ink)}
  .sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.08);margin:0 2px;vertical-align:middle;cursor:pointer}.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
  #home.hidden{display:none}
  .memo button{font:500 .8em/1.2 var(--fb);padding:.3em .55em;margin:.2em .2em 0 0;border-radius:.4em}
  .memo .q{font:700 1em var(--fd);margin-bottom:.1em}
  .room{position:relative;font-size:13px;background:#efe6d6}
  .room svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .room .ov{position:absolute;box-sizing:border-box}
  .room .tap{cursor:pointer}
  .room .tap:active{transform:scale(.98)}
  .board{background:#f7efdc;border:.35em solid #b98a5a;border-radius:.4em;padding:.5em .6em;box-shadow:0 .3em .8em rgba(40,30,10,.18);font:500 1em/1.35 var(--fb);color:var(--ink)}
  .board .lbl{font:700 .8em var(--fd);color:var(--dim);letter-spacing:.1em}
  .board .big{font:700 1.15em/1.35 var(--fd);margin-top:.15em}
  .pin{position:absolute;left:50%;top:-.55em;width:.9em;height:.9em;border-radius:50%;background:var(--ng);transform:translateX(-50%);box-shadow:0 .1em .2em rgba(0,0,0,.25)}
  .cal{background:#fff;border-radius:.3em;box-shadow:0 .2em .5em rgba(40,30,10,.15);text-align:center;overflow:hidden}
  .cal .mo{background:var(--ng);color:#fff;font:700 .75em/1.6 var(--fd)}
  .cal .day{font:700 2.1em/1.1 var(--fd);color:var(--ink)}
  .cal .wd{font:500 .75em/1.3 var(--fb);color:var(--ink2)}
  .cal .wk{font:500 .7em/1.3 var(--fb);color:var(--dim);border-top:1px dashed var(--line);margin-top:.2em}
  .shelfItems{display:flex;align-items:flex-end;gap:.5em;padding:0 .3em}
  .gift{background:#f0c9a0;border-radius:.25em;padding:.3em .4em;font:700 .8em/1.2 var(--fd);color:#6b3f1d;box-shadow:0 .15em .3em rgba(0,0,0,.15);position:relative;white-space:nowrap}
  .gift:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:.35em;margin-left:-.175em;background:var(--ng);opacity:.7}
  .gift span{position:relative;z-index:1;background:#f0c9a0;padding:0 .15em}
  .frame{background:#fff;padding:.25em .25em .6em;box-shadow:0 .2em .5em rgba(40,30,10,.2);transform:rotate(-3deg);width:4.6em}
  .frame img{display:block;width:100%;height:3.2em;object-fit:cover;background:var(--paper2)}
  .frame small{display:block;font:500 .6em/1.2 var(--fb);color:var(--ink2);text-align:center;margin-top:.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stampbook{background:#5d7bb0;color:#fff;border-radius:.2em .4em .4em .2em;padding:.4em .5em;font:700 .8em/1.2 var(--fd);box-shadow:0 .15em .3em rgba(0,0,0,.2);white-space:nowrap}
  .memo{background:#fdf3b5;padding:.5em .6em;font:500 .85em/1.4 var(--fb);color:#4a4020;box-shadow:0 .2em .4em rgba(40,30,10,.18);transform:rotate(-2deg)}
  .memo b{font:700 1em var(--fd)}
  .walletTag{background:#3e5a3a;color:#fff;border-radius:.3em;padding:.3em .55em;font:700 .95em/1.2 var(--fd);box-shadow:0 .2em .4em rgba(0,0,0,.2);white-space:nowrap}
  .walletTag small{font:500 .65em var(--fb);opacity:.85;margin-right:.3em}
  .tag{background:rgba(250,246,238,.92);border:1px solid var(--line);border-radius:.4em;padding:.25em .55em;font:500 .9em/1.3 var(--fb);color:var(--ink2);white-space:nowrap}
  .rideCard{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(250,246,238,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 12px 9px;box-shadow:0 6px 18px rgba(20,16,10,.22);z-index:6;pointer-events:auto}
.rideCard .rc1{display:flex;align-items:center;gap:10px}.rideCard .ri{flex:none;width:34px;height:34px;border-radius:10px;background:var(--paper2);display:inline-flex;align-items:center;justify-content:center;font-size:18px}.rideCard .ri svg{width:22px;height:22px}.rideCard .rt{flex:1;min-width:0}.rideCard .rt b{display:block;font:700 14px/1.25 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rideCard .rt small{display:block;font:500 11.5px/1.3 var(--fb);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rideCard .rb{font:700 12px/1.2 var(--fd);padding:7px 11px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;flex:none}
.rideCard .rprog{margin:9px 2px 6px}.rideCard .bar{position:relative;display:block;height:6px;border-radius:3px;background:var(--line)}.rideCard .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--acc),#e9a03a)}.rideCard .bar i{position:absolute;top:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;border:2px solid var(--dim);transform:translateY(-50%);box-sizing:border-box}.rideCard .bar i.done{border-color:var(--acc)}.rideCard .bar em{position:absolute;top:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translateY(-50%);box-sizing:border-box}
.rideCard .rmeta{display:flex;flex-wrap:wrap;gap:4px 6px;font:600 11.5px/1.3 var(--fb);color:var(--ink)}.rideCard .rmeta span{background:var(--paper2);border-radius:999px;padding:3px 8px}.rideCard .rmeta .nx{background:#fbeef1;color:#9a3a52}
@media (max-width:760px){.rideCard{bottom:calc(150px + env(safe-area-inset-bottom));left:8px;right:8px}}
.roomBar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;pointer-events:none;z-index:6}
.roomBar .rb{pointer-events:auto;font:700 13px/1.2 var(--fd);padding:9px 13px;border-radius:999px;background:rgba(250,246,238,.94);border:1px solid var(--line);color:var(--ink);box-shadow:0 3px 10px rgba(40,30,10,.16);backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.roomBar .rb .k{font:600 10px/1 var(--fb);color:var(--dim);letter-spacing:.08em;background:var(--paper2);border-radius:999px;padding:3px 6px}
.roomBar .rb.acc{background:var(--acc);border-color:var(--acc);color:#fff}.roomBar .rb.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.roomBar .rb:hover{transform:translateY(-1px)}
@media (max-width:760px){.roomBar{bottom:calc(150px + env(safe-area-inset-bottom));left:8px;right:8px}.roomBar .rb{font-size:12.5px;padding:9px 12px}}
.doorTag{background:var(--ink);color:#fff;border-radius:.5em;padding:.45em .7em;font:700 .95em/1.2 var(--fd);white-space:nowrap;box-shadow:0 .2em .4em rgba(0,0,0,.25)}
  .bubble{background:#fff;border-radius:.8em;padding:.5em .75em;font:500 1em/1.35 var(--fb);color:var(--ink);box-shadow:0 .2em .5em rgba(40,30,10,.18);position:relative;max-width:100%}
  .bubble:after{content:"";position:absolute;left:1.2em;bottom:-.5em;border:.5em solid transparent;border-top-color:#fff;border-bottom:0}
  .sub{display:none!important}
  #morning{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:3}
  #morning .q{font:700 15px/1.3 var(--fd);margin-bottom:8px}
  #morning .opts{display:flex;flex-wrap:wrap;gap:6px}
  #morning .opts button{padding:8px 12px;font-size:13px}
  #btns button .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;line-height:16px;text-align:center}
  /* 上部: 今どこ */
  #hud{display:flex;gap:10px;align-items:flex-start;position:absolute;left:10px;top:8px;width:400px;max-width:calc(100% - 440px);background:rgba(250,246,238,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;box-sizing:border-box}
  #hud .face{flex:none;width:46px;height:48px;border-radius:50%;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
  #hud .face svg{width:100%;height:100%;display:block}
  #hud .hbody{flex:1;min-width:0}
  #hud .now{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 11.5px var(--fd);color:var(--dim);letter-spacing:.08em}
  #hud .now b{font:600 12.5px var(--fb);color:var(--ink2);letter-spacing:0}
  #hud .st{font:700 17px/1.3 var(--fd);color:var(--ink);margin-top:3px}
  #hud .meta{font:500 12px/1.4 var(--fb);color:var(--ink2);margin-top:3px}
  #hfoot{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:560px;background:rgba(250,246,238,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:9px 12px;box-sizing:border-box}
  #hfoot.hidden{display:none}
  #mapLoad{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);margin:0 auto;max-width:360px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);z-index:5;text-align:center}
#mapLoad.hidden{display:none}
#panel{z-index:40}
.pr{font-style:normal;font:700 9px/1 var(--fb);color:#8a6d1f;background:#f6e7b0;border-radius:4px;padding:2px 4px;margin-left:3px;vertical-align:1px}
.adbox{margin:12px 0;padding:8px 10px 10px;border:1px dashed var(--line);border-radius:14px;background:#fffdf7;min-height:60px}.adbox small{display:block;font:600 10px/1 var(--fb);color:var(--dim);margin-bottom:6px;letter-spacing:.08em}
#story .adbox{margin:12px auto 0;max-width:420px;background:rgba(255,255,255,.92)}
.gift2 .gpr{display:block;margin-top:4px;font-size:11px}
.rwd{width:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;margin:0 0 10px;padding:10px 14px;border-radius:16px;border:0;background:linear-gradient(135deg,#5f9a5a,#4a8a4a);color:#fff;box-shadow:0 4px 12px rgba(74,138,74,.35);cursor:pointer}.rwd span{grid-row:1/3;font-size:24px}.rwd b{font:700 15px/1.2 var(--fd)}.rwd small{font:500 11px/1.3 var(--fb);opacity:.9}
.chips .hb{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important;font-weight:700}
.wkg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 8px}.wkg button{display:flex;align-items:center;gap:6px;text-align:left;border-radius:12px;padding:9px 10px;font:600 13px/1.25 var(--fb);background:#fff}.wkg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.wkg button:disabled{opacity:.4}.wkg button i{font-style:normal;font-size:17px}
.pgbar{position:sticky;top:-18px;z-index:3;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 10px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line)}.pgbar::-webkit-scrollbar{display:none}
.pgbar button{flex:none;border-radius:999px;padding:8px 14px;font:700 13px/1.1 var(--fd);background:#fff;white-space:nowrap}.pgbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pg{display:none}.pg.on{display:block}.pg.on.anim{animation:pgIn .16s ease-out}@keyframes pgIn{from{transform:translateY(5px)}to{transform:none}}
#panel .pg>.sec:first-child{display:none}

function seasonNow(t){t=t||Date.now();if(!SEASON||!SEASON.st)return {};const p=S.j.pos||[HOME.la,HOME.lo];let best=null,bd=1e18;for(const [n,v] of Object.entries(SEASON.st)){const d=dist(p,[v[0],v[1]]);if(d<bd){bd=d;best=[n,v];}}if(!best)return {};
  const [n,v]=best;const y=new Date(t).getFullYear();const dt=s=>{if(!s)return null;const [m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime();};const day=86400e3;
  const kaika=dt(v[2])||dt(v[3]),mankai=dt(v[4])||dt(v[5])||(kaika?kaika+7*day:null),kaede=dt(v[6])||dt(v[7]),icho=dt(v[8])||dt(v[9]);

    if(homeChanged){const ok=$('sOk');ok.disabled=true;mbox.classList.remove('setup');mbox.innerHTML=`<h2>街を用意しています</h2><p id="ldMsg">住所のまわりを調べています…</p><p style="color:var(--dim)">OpenStreetMap から道と店を取り込みます。30秒〜1分ほど。遠くの名所は始まってから後追いで足します。</p>`;
      try{let town;if(chosen.sample&&typeof KICHI!=='undefined')town=KICHI;else town=await buildTown(chosen.la,chosen.lo,chosen.label,true,m=>{const el=$('ldMsg');if(el)el.textContent=m;});
        initTown(town);saveTown(town);S.homeLL=[chosen.la,chosen.lo];S.homeAddr=chosen.addr;S.homeExact=!!chosen.exact;S.townName=chosen.label;
        S.trip=null;S.j={t:Date.now(),state:'home',pos:[HOME.la,HOME.lo],at:-1,path:[],seg:0,segPos:0,target:-1,until:0,lastReport:0,straight:null};
        toast(chosen.label+'の店・場所 '+POIS.length+'件を取り込みました','var(--acc)');}
      catch(e){mbox.classList.remove('setup');mbox.innerHTML=`<h2>街を取り込めませんでした</h2><p>${(e&&e.message)||e}</p><p style="color:var(--dim)">地図サーバーが混んでいることがあります。少し待ってもう一度、または別の住所で。</p><button id="sRetry">設定にもどる</button>`;$('sRetry').onclick=showSetup;return;}}
    if(!S.setup){S.field.lastSprout=Date.now();}
    S.setup=true;{const now0=Date.now();const d0=new Date(now0);d0.setHours(0,0,0,0);const en0=d0.getTime()+S.work.end*60000;S.kick={k:todayKey(now0),st:now0-1000,en:Math.max(en0,now0+3*3600e3)};S.j.state='home';S.j.at=-1;S.j.until=0;}modal.classList.add('hidden');toast(S.name+'、いま家を出ます');renderPanel();save();if(S.homeLL)setTimeout(()=>stampAt(S.homeLL[0],S.homeLL[1],Date.now()),2000);};}
function showReport(r,sec){const A=S.name;const visits=r.entries?r.entries.filter(e=>e.kind==='visit'):r.visits.map(i=>POIS[i]).filter(Boolean);const spent=r.spent;
  const list=(r.entries?visits.slice(-6).map(e=>'・'+fmtT(e.t)+' '+e.text):visits.slice(-6).map(p=>'・'+p.n+'で'+info(p).label)).join('<br>');
  mbox.classList.remove('setup');mbox.innerHTML=`<h2>おかえりなさい</h2><p>留守 ${fmtDur(sec)}。${statusText().replace(/^[^ ]+ /,'')}</p>
   ${visits.length?`<div style="text-align:left"><b style="color:var(--acc)">${A}が寄ったところ</b><br>${list}</div>`:`<div style="color:var(--dim)">${A}は${S.j.state==='home'?'家にいました':'歩いていました'}</div>`}
   <div style="margin:6px 0;color:var(--dim)">使ったお小遣い <b style="color:var(--fg)">¥${fmt(spent)}</b> / のこり <b style="color:var(--acc)">¥${fmt(S.wallet)}</b>${S.field.slots.filter(s=>s.stage===2).length?` / 収穫できる${(JOBS[S.job]||JOBS.other).item}が ${S.field.slots.filter(s=>s.stage===2).length}つ`:''}</div>
   <button id="wClose">日記を見る</button>`;
  modal.classList.remove('hidden');$('wClose').onclick=()=>{modal.classList.add('hidden');openTab('diary');};}

/* ========== ループ ========== */
let last=performance.now(),hudT=0;
let hiddenSince=0,lastTickAt=0;
function sinceReport(since){const es=S.diary.filter(e=>e.t>=since);return {visits:[],entries:es,spent:es.reduce((a,e)=>a+(e.cost||0),0)};}
function tick(){if(!S.setup||!M)return;const now=Date.now();if(now-lastTickAt<900)return;lastTickAt=now;const gap=(now-S.lastTick)/1000;S.lastTick=now;
  const r={visits:[],spent:0};const w0=S.wallet;simTo(now,r);fieldTick(now);r.spent=Math.max(0,w0-S.wallet);
  const vis=document.visibilityState==='visible';
  if(vis&&r.visits.length){const p=POIS[r.visits[r.visits.length-1]];if(p){toast(S.name+'は'+p.n+'で'+info(p).label,'var(--acc)');if(tab==='diary'||tab==='plan')renderPanel();}}
  if(gap>900&&vis){showReport(sinceReport(now-gap*1000),gap);save();}
  tickAsks(now);if(vis)maybeDetourAsk(now);if(S.asks.some(a=>!a.done)&&vis)renderAsk();
  updateWeather();try{recordTrail(now);moneyDaily(now);updateWarnings();maybeStory(now);if(memMode&&Math.floor(now/1000)%5===0)renderMemCard();}catch(e){console.warn('v60 tick',e);}}
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenSince=Date.now();save();}
  else if(hiddenSince&&Date.now()-hiddenSince>10*60000){const since=hiddenSince;hiddenSince=0;tick();showReport(sinceReport(since),(Date.now()-since)/1000);}else hiddenSince=0;});
function frame(t){try{frameBody(t);}catch(e){console.error(e);if(!window.__frameErrShown){window.__frameErrShown=true;toast('画面の更新でエラー: '+(e&&e.message||e),'var(--ng)');}}requestAnimationFrame(frame);}
function frameBody(t){if(!M){last=t;return;}const dt=Math.min(0.1,(t-last)/1000);last=t;const now=Date.now();
  tick();
  if(S.setup){const st=S.j.state;const atHomeF=S.j.at===-1&&st!=='walk'&&!S.j.transit&&!S.trip;
    if(fState!==st){if(fState==='home'&&st==='walk'&&!S.trip){leaveAnim={t0:t};bubble={text:'いってきます',until:t+6000,next:20000};if(view==='home'){leaveRoom={t0:Date.now(),dur:3000};roomSay('いってきます!',3500);homeSig='';}else if(Date.now()-manualViewAt>120000&&view!=='map')setView('map');}
      else if(fState==='walk'&&atHomeF){bubble={text:'ただいま',until:t+6000,next:20000};roomSay('ただいま',6000);if(Date.now()-manualViewAt>120000&&view!=='home')setView('home');}
      fState=st;}}
  {const rk=curRideKind();if(rk!==lastRideKind){if(rk&&!leaveRoom&&Date.now()-manualViewAt>120000&&view==='map')setView('home');else if(!rk&&lastRideKind&&Date.now()-manualViewAt>120000&&view==='home'&&!(S.j.at===-1&&S.j.state!=='walk'&&!S.j.transit))setView('map');lastRideKind=rk;homeSig='';}}
  if(view==='home'){homeT+=dt;if(homeT>=0.05){homeT=0;fitRoom();drawScene();renderHome(false);}if(leaveRoom&&Date.now()-leaveRoom.t0>leaveRoom.dur+400){leaveRoom=null;homeSig='';if(Date.now()-manualViewAt>120000||true)setView('map');}const fh=$('fieldHome');if(fh&&fh.offsetParent!==null)drawFieldOn(fh,t);const ff=document.getElementById('field');if(ff&&ff.offsetParent!==null)drawFieldOn(ff,t);}else draw(t);
  hudT+=dt;if(hudT>0.25){hudT=0;{const ready=S.field.slots.filter(x=>x.stage===2).length;$('bFarm').innerHTML='<i>🌱</i><span>畑</span>'+(ready?'<span class="cnt">'+ready+'</span>':'');}updateMorning();renderHud();renderFoot();checkMapLoad();if(S.setup&&M)updateWeather();}}
function onMapClick(cx,cy){ // 店をタップで行きたい
  let best=-1,bd=18;const e={clientX:cx,clientY:cy};for(let i=0;i<POIS.length;i++){const [x,y]=px(POIS[i].la,POIS[i].lo);const d=Math.hypot(x-e.clientX,y-e.clientY);if(d<bd){bd=d;best=i;}}
  if(best>=0)showPoiCard(best);else $('poiCard').classList.add('hidden');}
function showPoiCard(i){const p=POIS[i];const k=remember(p);const price=priceOf(p);const el=$('poiCard');const v=S.visited[k];const op=isOpen(p.h,new Date());
  el.innerHTML=`<div class="q"><span class="em" style="background:${COLORS[p.k]||'#ddd'}">${info(p).e}</span><span>${esc(p.n)}</span></div><div style="color:var(--ink2);font-size:12px">${info(p).label}${CUIS[p.c]?'・'+menuName(p):''}${price?' / ¥'+fmt(price)+'くらい':''}${p.h?' / '+(op===false?'<span style="color:var(--ng)">いま閉店中</span>':'営業時間 '+p.h):''}${v?' / '+S.name+'は'+v.n+'回':''}</div>
    <div class="opts"><button data-w="1">${S.wish.includes(k)?'♥ 行きたいから外す':'♡ 行きたい'}</button><button data-go="1" class="buy">今すぐ寄って</button><a href="${gmapsLL(p)}" target="_blank" rel="noopener" style="align-self:center;margin-left:4px">Googleマップ</a><button data-x="1" style="margin-left:auto">閉じる</button></div>`;
  el.querySelector('[data-w]').onclick=()=>{if(S.wish.includes(k))S.wish=S.wish.filter(x=>x!==k);else S.wish.push(k);save();showPoiCard(i);if(tab==='wish')renderPanel();};
  el.querySelector('[data-go]').onclick=()=>{const now=Date.now();if(!inWork(now)){toast(actMode()==='work'?'勤務時間外は動きません。行きたいには入れておきます':'いまは眠っている時間。行きたいには入れておきます','var(--ng)');if(!S.wish.includes(k))S.wish.push(k);save();return;}if(S.j.transit||S.j.cityTarget){toast('いま乗り物で移動中なので、着いてから','var(--ng)');if(!S.wish.includes(k))S.wish.push(k);save();return;}
    if(op===false){toast('いま閉まっています。行きたいに入れました');if(!S.wish.includes(k))S.wish.push(k);save();return;}
    addDiary({kind:'note',text:'あなたに「'+p.n+'に寄って」と言われたので、そこへ向かう',t:now});S.j.straight=null;go(i,now);toast(S.name+'が'+p.n+'へ向かいます','var(--acc)');el.classList.add('hidden');save();};
  el.querySelector('[data-x]').onclick=()=>el.classList.add('hidden');el.classList.remove('hidden');}
$('basemap').addEventListener('click',e=>{if(!MAPBASE)onMapClick(e.clientX,e.clientY);});
setInterval(save,5000);addEventListener('beforeunload',save);
resize();
/* ホーム画面に置ける形(PWA)。artifact やローカル直開きでは登録しない */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude\.ai/.test(location.hostname)){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e&&e.message));});}
/* 通知: 画面を見ていない時だけ。10分に1回まで */
let lastNotifyAt=0;
async function notify(title,body){try{if(!S.notify||document.visibilityState==='visible')return;if(typeof Notification==='undefined'||Notification.permission!=='granted')return;if(Date.now()-lastNotifyAt<10*60000)return;lastNotifyAt=Date.now();
  let reg=null;try{reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();}catch(e){}
  if(reg&&reg.showNotification)await reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png',tag:'officetravel'});else new Notification(title,{body,icon:'icon-192.png'});}catch(e){console.warn('notify',e);}}
async function enableNotify(){if(typeof Notification==='undefined'){toast('このブラウザは通知に対応していない','var(--ng)');return;}let p=Notification.permission;if(p==='default'){try{p=await Notification.requestPermission();}catch(e){}}
  if(p==='granted'){S.notify=true;save();toast('通知をオンにした。画面を閉じている間の到着・宿・雨を知らせる','var(--acc)');}else{S.notify=false;save();toast('通知が許可されなかった(ブラウザの設定で許可できる)','var(--ng)');}renderPanel();}
(function boot(){try{loadAds();}catch(e){}document.querySelectorAll('#btns i[data-ic]').forEach(i=>{i.innerHTML=ICON[i.dataset.ic]||'';});setTimeout(()=>{if(S.setup)refreshTownPois();},20000);setTimeout(()=>{refineHome();},6000);setInterval(()=>{if(S.setup)refreshTownPois();},30*60000);
let town=null;try{const raw=localStorage.getItem(TOWN_KEY);if(raw)town=JSON.parse(raw);}catch(e){}
  if(S.trip){let away=null;try{const a=JSON.parse(localStorage.getItem(AWAY_KEY)||'null');if(a&&a.name===S.trip.city)away=a.nodes?a:townCacheGet(a.name,a.la,a.lo);}catch(e){}if(away)town=away;}
  const j=S.j;j.planning=null;j.cityTarget=null;const wasLoading=j.loadingTown;j.loadingTown=null;
  let awayMissing=false;if(S.trip&&(!town||town.name!==S.trip.city)){awayMissing=true;}
  if(town){initTown(town);if(town.wideLoaded===false||(town.wide&&!town.wide.length&&!town.wideLoaded))setTimeout(()=>loadWideAsync(town,town.center[0],town.center[1]),3000);}else if(typeof KICHI!=='undefined'){initTown(KICHI);}
  if(S.setup&&M&&(awayMissing||wasLoading)&&S.trip){const c=CITIES_JP.find(x=>x[0]===S.trip.city);const la=c?c[1]:(j.pos?j.pos[0]:M.center[0]),lo=c?c[2]:(j.pos?j.pos[1]:M.center[1]);
    j.state='stay';j.until=Date.now()+60000;setTimeout(()=>arriveCity({name:S.trip.city,la,lo,resume:true},Date.now()),500);}
  // 家の街が保存されていない(容量不足・別ブラウザ等)のに設定済みなら、裏で取り直す
  if(S.setup&&S.homeLL&&!S.trip&&(!town||dist([town.center[0],town.center[1]],S.homeLL)>400)){const [la,lo]=S.homeLL;toast('家のまわりの地図を取り直しています…','var(--dim)');
    buildTown(la,lo,S.townName||'家のまわり',true,()=>{}).then(tn=>{initTown(tn);saveTown(tn);if(!j.pos||dist(j.pos,[la,lo])>3000){j.at=-1;j.pos=[la,lo];}toast('家のまわりの店・場所 '+POIS.length+'件','var(--acc)');}).catch(e=>{toast('地図を取り直せなかった。設定から家を選び直してください','var(--ng)');});}
  if(!S.setup||!M)showSetup();
  viewHomeUntil=Date.now()+2500;checkFlightsStatic();fState=S.j.state;setView((S.j.at===-1&&S.j.state!=='walk'&&!S.j.transit&&!S.trip)?'home':'map');
  requestAnimationFrame(frame);})();
</script>
