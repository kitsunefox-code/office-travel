<style>
  :root{
    --paper:#faf6ee;--paper2:#f1ebdf;--line:#e3dccb;--ink:#2a2f3a;--ink2:#5b6270;--dim:#8a9099;
    --acc:#d9773b;--acc2:#f2c9ab;--ok:#3f8f5f;--ng:#c8503c;--info:#3a78b5;--gold:#b8860b;
    --map:#f3efe6;--shadow:0 6px 24px rgba(40,30,10,.14),0 1px 3px rgba(40,30,10,.10);

  }

  html,body{margin:0;height:100%;background:var(--map);color:var(--ink);font:13px/1.5 var(--fb);overflow:hidden;user-select:none}

  #basemap .maplibregl-ctrl-attrib{font-size:9px;opacity:.75}
  #map{position:absolute;left:0;top:0;right:0;bottom:0;display:block;pointer-events:none;background:transparent}
  #field{display:block;width:100%;height:96px;border-radius:10px;cursor:pointer;background:#6b8f4e;touch-action:manipulation}
  #ask,#poiCard{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:4}
  #ask .q,#poiCard .q{font:700 15px/1.3 var(--fd);margin-bottom:6px}
  #ask .opts,#poiCard .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  #ask .opts button,#poiCard .opts button{padding:8px 12px;font-size:13px}
  #ask .ttl{color:var(--dim);font-size:11px;margin-top:6px}
  .bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
  #morning{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:3}
  #morning .q{font:700 15px/1.3 var(--fd);margin-bottom:8px}
  #morning .opts{display:flex;flex-wrap:wrap;gap:6px}
  #morning .opts button{padding:8px 12px;font-size:13px}
  #btns button .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;line-height:16px;text-align:center}
  /* 上部: 今どこ */
  #hud{position:absolute;left:10px;top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 420px);pointer-events:none}

  #hud .who{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--ink)}
  #hud #status{font-size:13px;color:var(--ink);font-weight:500}
  #hud #wallet{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.3px}
  #hud .badge{background:transparent;border:0;padding:0;font-size:12px;color:var(--ink2)}
  #hud #clock{font-variant-numeric:tabular-nums}
  /* 右上: タブ */

  #btns button:hover{background:var(--paper2);color:var(--ink)}
  #btns button.act{background:var(--ink);color:#fff}
  button{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:5px 11px;font:500 13px/1.2 var(--fb);cursor:pointer}
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  button:disabled{opacity:.45;cursor:default}
  button.buy,#modal button.buy,#sOk{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
  button.buy:hover,#sOk:hover{background:#c4692f}
  /* 右パネル: 日記・旅程 */
  #panel{position:absolute;right:10px;top:50px;bottom:16px;width:392px;max-width:calc(100% - 20px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;overflow:auto;box-shadow:var(--shadow)}
  #panel h3{margin:0 0 10px;font:700 17px/1.3 var(--fd);color:var(--ink);letter-spacing:.2px;padding-right:28px}
  #panel .pclose{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;padding:0;font-size:15px;line-height:1;color:var(--ink2)}
  #panel .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  #panel .row small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.45;margin-top:1px}
  #panel .row b{font-weight:700}
  #panel .row button{white-space:nowrap}
  #panel .note{color:var(--dim);font-size:11.5px;margin-top:8px;line-height:1.5}
  #panel a{color:var(--info);text-decoration:none;border-bottom:1px solid rgba(58,120,181,.3)}
  #panel a:hover{border-bottom-color:var(--info)}
  #panel button.on{color:var(--acc);border-color:var(--acc);background:#fff}
  #panel input,#panel select,#panel textarea{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  #panel input:focus,#panel textarea:focus,#panel select:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
  .polaroid{display:inline-block;width:110px;background:#fff;color:#222;padding:7px 7px 9px;margin:4px 6px 6px 0;border-radius:3px;box-shadow:0 3px 10px rgba(40,30,10,.18);transform:rotate(-1.2deg);vertical-align:top}
  .polaroid:nth-child(even){transform:rotate(1.2deg)}
  .polaroid .pic{height:74px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
  .polaroid .pic img{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block}
  .polaroid .cap{font-size:10.5px;line-height:1.3;margin-top:6px;color:#333;font-family:var(--fd)}
  .polaroid .credit{font-size:8px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .receipt{font:12px/1.5 var(--fb);background:#fff;color:var(--ink);padding:8px 10px;border-radius:8px;margin:6px 0;border:1px solid var(--line);border-left:3px solid var(--acc2)}
  .receipt button{padding:3px 9px;font-size:12px}
  .tl{display:grid;grid-template-columns:44px 20px 1fr;gap:0 6px;align-items:start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.45}
  .tl .tlt{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
  .tl .tle{text-align:center}
  .tl .tlc{color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:6px}
  /* 見出しつきの区切り */
  #panel .sec{font:700 13px/1.3 var(--fd);color:var(--ink2);margin:14px 0 4px;letter-spacing:.4px}

  #modal h2{margin:0 0 6px;font:700 18px/1.3 var(--fd);color:var(--ink);text-wrap:balance}
  #modal p{margin:2px 0 8px;color:var(--ink2)}
  #modal .big{font-size:24px;color:var(--ink);margin:6px 0;font-variant-numeric:tabular-nums}
  #modal button{margin:4px}
  #modal select,#modal input{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  #modal input[type=time]{width:112px}
  #modal label{cursor:pointer}
  .hidden{display:none!important}
  #toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(42,47,58,.92);color:#fff;padding:6px 14px;border-radius:10px;pointer-events:none;transition:opacity .4s;opacity:0;font-size:12.5px;box-shadow:var(--shadow);max-width:90%}
  @media (max-width:760px){
    html,body{font-size:14px}
    #hud{left:8px;right:8px;top:8px;max-width:none;gap:6px}
    #hud .card{padding:6px 10px;gap:8px}
    #btns{top:auto;bottom:0;left:0;right:0;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;background:rgba(250,246,238,.98)}
    #btns button{padding:8px 6px;font-size:12px;min-width:44px;flex:1}
    #panel{left:0;right:0;width:auto;top:auto;bottom:calc(52px + env(safe-area-inset-bottom));height:60%;border-radius:16px 16px 0 0;padding:14px 14px 18px}
    #morning,#ask,#poiCard{bottom:calc(60px + env(safe-area-inset-bottom))}
    #toast{bottom:calc(64px + env(safe-area-inset-bottom))}
    #modal .box{padding:12px 14px;max-height:92%}
    .polaroid{width:calc(50% - 8px);max-width:150px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this;};}

 sales:{n:'営業',item:'お客さん',e:'🧑‍💼',verb:'契約'},eng:{n:'エンジニア',item:'バグ',e:'🐛',verb:'修正'},design:{n:'デザイナー',item:'アイデア',e:'💡',verb:'採用'},

 teacher:{n:'先生',item:'ひらめき',e:'✨',verb:'伝わった'},maker:{n:'ものづくり',item:'部品',e:'🔩',verb:'完成'},other:{n:'その他',item:'がんばり',e:'🪙',verb:'ひと区切り'}};

let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(fresh(),JSON.parse(raw));S.j=Object.assign(fresh().j,S.j||{});S.work=Object.assign(fresh().work,S.work||{});S.field=Object.assign(fresh().field,S.field||{});S.taught=Object.assign(fresh().taught,S.taught||{});S.taught.habits=Object.assign(fresh().taught.habits,S.taught.habits||{});if(!Array.isArray(S.taught.fares))S.taught.fares=[];S.keys=Object.assign(fresh().keys,S.keys||{});if(typeof S.energy!=='number')S.energy=80;if(Array.isArray(S.wish)&&S.wish.some(x=>typeof x==='number'))S.wish=[];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=id=>document.getElementById(id);

function fmt(n){return Math.floor(n).toLocaleString('ja-JP');}

/* ========== 勤務時間 ========== */
function workWindow(t){const d=new Date(t);if(!S.work.days.includes(d.getDay()))return null;d.setHours(0,0,0,0);return {st:d.getTime()+S.work.start*60000,en:d.getTime()+S.work.end*60000};}
function inWork(t){const w=workWindow(t);return !!w&&t>=w.st&&t<w.en;}
function nextWorkStart(t){for(let d=0;d<21;d++){const w=workWindow(t+d*86400000);if(w&&w.st>t)return w.st;}return t+21*86400000;}

/* ========== 地図データ ========== */
let M=null,NODES=[],EDGES=[],POIS=[],adj=[],HOME={la:35.7012,lo:139.5672,nn:0},COSL=1;

  const hl=S.homeLL||[m.home[0],m.home[1]];const isHomeTown=dist(hl,[m.center[0],m.center[1]])<400;

  if(!MAPBASE)initBasemap();if(MAPBASE){try{MAPBASE.jumpTo({center:[m.center[1],m.center[0]],zoom:16.2});}catch(e){}}}
function PK(p){return p.n+'@'+(+p.la).toFixed(4)+','+(+p.lo).toFixed(4);}

const AWAY_KEY='officetravel.away.v1';const TOWNS_KEY='officetravel.towns.v1';
function townCacheGet(name,la,lo){try{const idx=JSON.parse(localStorage.getItem(TOWNS_KEY)||'[]');for(const e of idx){if(e.name===name&&Math.abs(e.la-la)<0.003&&Math.abs(e.lo-lo)<0.003){const t=JSON.parse(localStorage.getItem('officetravel.town.'+e.id)||'null');if(t)return t;}}}catch(e){}return null;}
function townCachePut(town){try{let idx=JSON.parse(localStorage.getItem(TOWNS_KEY)||'[]');const id=String(Date.now());const rec={id,name:town.name,la:town.center[0],lo:town.center[1],t:Date.now()};
  for(let tries=0;tries<5;tries++){try{localStorage.setItem('officetravel.town.'+id,JSON.stringify(town));idx=idx.filter(e=>!(e.name===rec.name&&Math.abs(e.la-rec.la)<0.003));idx.push(rec);while(idx.length>4){const old=idx.shift();localStorage.removeItem('officetravel.town.'+old.id);}localStorage.setItem(TOWNS_KEY,JSON.stringify(idx));return true;}
    catch(e){if(!idx.length)return false;const old=idx.shift();localStorage.removeItem('officetravel.town.'+old.id);localStorage.setItem(TOWNS_KEY,JSON.stringify(idx));}}}catch(e){}return false;}
const TOWN_KEY='officetravel.town.v1';
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
async function overpass(q,timeoutMs){let err;for(const ep of OVERPASS){const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),timeoutMs||75000);try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();clearTimeout(tm);return j.elements||[];}catch(e){err=e;}finally{clearTimeout(tm);}}throw err||new Error('地図サーバーに届きませんでした');}
async function geocodeOnce(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&addressdetails=1&accept-language=ja&countrycodes=jp&q='+encodeURIComponent(q));if(!r.ok)throw new Error('住所検索に失敗');return r.json();}
function addrVariants(q){q=q.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[－‐―ー−]/g,'-').replace(/\s+/g,' ').trim();const out=[q];
  const m=q.match(/^(.*?)(\d+)-(\d+)(?:-(\d+))?$/);if(m){out.push(m[1]+m[2]+'丁目'+m[3]);out.push(m[1]+m[2]+'丁目');}
  const m2=q.match(/^(.*?)(\d+)丁目(\d+)(?:番)?(\d+)?(?:号)?$/);if(m2)out.push(m2[1]+m2[2]+'丁目');
  const m3=q.match(/^(.*?)(\d+)(丁目|番地|番|号).*$/);if(m3)out.push(m3[1]+m3[2]+'丁目');
  const noNum=q.replace(/[\d\-丁目番地号]+$/,'').trim();if(noNum&&noNum!==q)out.push(noNum);

$('bDiary').onclick=()=>openTab('diary');$('bWish').onclick=()=>openTab('wish');$('bFriends').onclick=()=>openTab('friends');$('bMore').onclick=()=>openTab('more');
function gmaps(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.n+' '+(S.townName||''))+'&query_place_id=';}
function gmapsLL(p){return 'https://www.google.com/maps/search/?api=1&query='+p.la+','+p.lo;}
function renderPanel(){if(!tab)return;let h='';
  if(tab==='diary'){h+=`<h3>${S.name}の日記</h3><div style="margin:-4px 0 6px"><button id="bCopyDay">今日の日記をコピー</button> <button id="bCopyWeek">7日分をコピー</button></div>`;
    const days={};S.diary.slice().reverse().forEach(e=>{(days[todayKey(e.t)]=days[todayKey(e.t)]||[]).push(e);});
    const keys=Object.keys(days).slice(0,3);if(!keys.length)h+='<div class="note">まだ何も。勤務時間になると家を出ます。</div>';
    for(const k of keys){const es=days[k];const spent=es.filter(e=>e.cost).reduce((a,e)=>a+e.cost,0);
      h+=`<div class="sec">${fmtD(es[0].t)}　<span style="font-weight:400">使った ¥${fmt(spent)} / 寄った ${es.filter(e=>e.kind==='visit').length}軒</span></div>`;
      h+='<div>'+es.filter(e=>e.kind==='visit').slice(0,6).map(e=>{const ph=S.photos[e.pk];const hasPic=ph&&ph.src;if(!ph&&typeof fetch==='function'&&e.pk)setTimeout(()=>fetchPhoto(e.pk),10);
        return `<div class="polaroid"><div class="pic" style="background:${e.color}">${hasPic?`<a href="${ph.url}" target="_blank" rel="noopener"><img src="${ph.src}" alt="${e.pn||''}" loading="lazy"></a>`:e.emoji}</div><div class="cap">${fmtT(e.t)} ${e.pn||''}${e.cost?'<br>¥'+fmt(e.cost):''}</div>${hasPic?`<div class="credit" title="${ph.credit}">${ph.credit}</div>`:''}</div>`;}).join('')+'</div>';
      h+=es.map(e=>{if(e.kind==='visit'){const p={n:e.pn,la:e.pla,lo:e.plo};return `<div class="receipt">${fmtT(e.t)} ${e.text}${e.mood?`<div style="color:#777;font-style:italic">— ${e.mood}</div>`:''}${e.cost?`<div style="text-align:right">¥${fmt(e.cost)}</div>`:''}<div style="margin-top:3px"><button data-wish="${e.pk}" class="${S.wish.includes(e.pk)?'on':''}">${S.wish.includes(e.pk)?'♥ 行きたい':'♡ 行きたい'}</button> ${e.lodging?hotelLinks(e.pn,e.town):`<a href="${gmapsLL(p)}" target="_blank" rel="noopener">Googleマップで開く</a>`}</div></div>`;}
        return `<div class="tl"><span class="tlt">${fmtT(e.t)}</span><span class="tle">${e.emoji||'・'}</span><span>${e.text}</span></div>`;}).join('');}}
  if(tab==='farm'){const J=JOBS[S.job];const ready=S.field.slots.filter(x=>x.stage===2).length;
    h+=`<h3>お小遣いの畑</h3><div class="note" style="margin:0 0 8px">あなたの仕事(${J.n})の${J.item}${J.e}が育つ。大きくなったらタップして収穫。それが${S.name}のお小遣いになる。放っておくと勝手に片づいて半分。</div>
      <canvas id="field"></canvas>
      <div class="row"><div>いま収穫できる<small>${ready}個 / 育つのに約5分、約1分半に1個生える</small></div><b style="color:var(--gold)">¥${fmt(ready*YIELD[2])}</b></div>
      <div class="row"><div>これまでの収穫<small>${S.name}に渡したお小遣いの合計</small></div><b>¥${fmt(S.stats.harvest)}</b></div>
      <div class="row"><div>いまの財布<small>${S.name}が持っているお金</small></div><b style="color:var(--gold)">¥${fmt(S.wallet)}</b></div>`;}
  if(tab==='plan'){h+='<h3>旅程</h3>';

    if(tr)h+=`<div class="row"><div>旅の途中<small>${fmtD(tr.since)}に出発 / ${tr.cities.join(' → ')} / ${Math.floor((Date.now()-tr.since)/86400000)+1}日目</small></div></div>`;

      ${S.request?`<div class="note" style="color:var(--ok)">📌 次の朝: ${S.request.name} へ向かう予定 <button id="rqClear">取り消す</button></div>`:''}`;
    h+=`<div class="note">遠出: 朝に気分と財布で決める。移動は乗換案内の実ダイヤ(新幹線・特急も本物の列車名)。飛行機は時刻表データがまだ無いので乗らない。訪ねた街: ${Object.keys(S.cities).join('、')||'まだなし'}</div>`;}
  if(tab==='teach'){const T=S.taught;h+='<h3>教える</h3><div class="note">乗換案内に無い土地勘、店の好み、癖をあなたが教える。教えたことは機械の経路案内より優先される。</div>';
    h+=`<div class="row" style="border:0"><div><b>店を教える</b><small>店名の一部で探す</small></div></div><div><input id="tShop" placeholder="例: いせや" style="width:70%;padding:3px 6px;border-radius:6px;border:1px solid #666;background:#fff;color:#222"> <button id="tShopFind">探す</button></div><div id="tShopRes"></div>`;
    const shops=Object.entries(T.shops);if(shops.length)h+='<div style="margin:4px 0">'+shops.map(([k,v])=>`<div class="row"><div>${v.mode==='like'?'👍':'🚫'} <b>${v.n}</b><small>${v.memo||''}</small></div><button data-unteach="${k}">✕</button></div>`).join('')+'</div>';
    h+=`<div class="row" style="border:0;margin-top:8px"><div><b>行き方を教える</b><small>「家 → 吉祥寺駅 は ムーバスで 12分 220円 15分おき」のように</small></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><input id="tFrom" placeholder="出発(家 / 街名 / 店名)" value="家"><input id="tTo" placeholder="到着(店名 / 街名)"><input id="tBy" placeholder="手段(ムーバス、リムジンバス…)"><input id="tMin" type="number" placeholder="所要 分"><input id="tFare" type="number" placeholder="料金 円"><input id="tEvery" type="number" placeholder="何分おき"></div><div style="margin-top:4px"><button id="tRouteAdd">この行き方を教える</button></div>`;
    if(T.routes.length)h+='<div style="margin:4px 0">'+T.routes.map((r,i)=>`<div class="row"><div>🧭 <b>${r.from} → ${r.to}</b><small>${r.by} ${r.min||'?'}分${r.fare?' ¥'+r.fare:''}${r.every?' '+r.every+'分おき':''}</small></div><button data-unroute="${i}">✕</button></div>`).join('')+'</div>';
    h+=`<div class="row" style="border:0;margin-top:8px"><div><b>運賃を教える</b><small>遠出の切符代。教えた区間は推定ではなくこの額を使う(往復どちらでも)</small></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px"><input id="fFrom" placeholder="出発(家 / 街名)" value="${S.townName||'家'}"><input id="fTo" placeholder="到着(街名)"><input id="fFare" type="number" placeholder="円"></div><div style="margin-top:4px"><button id="fAdd">この運賃を教える</button></div>`;
    if(T.fares.length)h+='<div style="margin:4px 0">'+T.fares.map((f,i)=>`<div class="row"><div>🎫 <b>${f.from} → ${f.to}</b><small>¥${fmt(f.fare)}</small></div><button data-unfare="${i}">✕</button></div>`).join('')+'</div>';
    h+=`<div class="row" style="border:0;margin-top:8px"><div><b>癖を教える</b></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px">
      <label><input type="checkbox" class="tHabit" value="noRain" ${T.habits.noRain?'checked':''}> 雨の日は出かけない</label><label><input type="checkbox" class="tHabit" value="coffee" ${T.habits.coffee?'checked':''}> 昼下がりは必ずコーヒー</label>
      <label><input type="checkbox" class="tHabit" value="wander" ${T.habits.wander?'checked':''}> 知らない道に入ってみる</label><label><input type="checkbox" class="tHabit" value="sea" ${T.habits.sea?'checked':''}> 海を見ると長居する</label><label><input type="checkbox" class="tHabit" value="foodie" ${T.habits.foodie?'checked':''}> 食べ歩きが好き</label><label><input type="checkbox" class="tHabit" value="cheap" ${T.habits.cheap?'checked':''}> 高い店は避ける</label><label><input type="checkbox" class="tHabit" value="train" ${T.habits.train?'checked':''}> 電車が好き(遠出が増える)</label></div>
      <textarea id="tMemo" placeholder="そのほか、伝えておきたいこと(メモとして日記に残る)" style="width:100%;height:44px;margin-top:6px;border-radius:6px;border:1px solid #666;background:#fff;color:#222;font:inherit">${T.memo||''}</textarea><div style="margin-top:4px"><button id="tMemoSave">メモを渡す</button></div>`;}
  if(tab==='wish'&&S.recs.length){h+=`<h3>${S.name}のおすすめ</h3><div class="note">寄ってみて良かった所。あなたも好きそう、と思ったもの</div>`+S.recs.slice(0,8).map(r=>`<div class="row"><div>${(KIND[r.k]||{}).e||'📍'} <b>${r.pn}</b><small>${r.town||''} / ${r.reason}</small><small>${LODGING.has(r.k)?hotelLinks(r.pn,r.town):`<a href="https://www.google.com/maps/search/?api=1&query=${r.la},${r.lo}" target="_blank" rel="noopener">Googleマップで開く</a>`}</small></div><button data-wish="${r.pk}" class="${S.wish.includes(r.pk)?'on':''}">${S.wish.includes(r.pk)?'♥':'♡ 行きたい'}</button></div>`).join('');}
  if(tab==='wish'){h+='<h3>行きたいリスト</h3><div class="note">'+S.name+'が寄った店に♡を付けると溜まる。本当に行ったら「行ってきた」。</div>';
    if(!S.wish.length)h+='<div class="note" style="margin-top:8px">まだありません。日記の店に♡を。</div>';
    for(const k of S.wish){const p=poiOf(k);if(!p)continue;const v=S.visited[k];h+=`<div class="row"><div>${info(p).e} <b>${p.n}</b><small>${p.town?p.town+' / ':''}${p.c?p.c+' / ':''}${info(p).label}${v?' / '+S.name+'は'+v.n+'回':''}${S.went[k]?' / <span style="color:var(--ok)">あなたも行った('+fmtD(S.went[k])+')</span>':''}</small><small><a href="${gmapsLL(p)}" target="_blank" rel="noopener">Googleマップで開く(人気メニュー・経路はこちら)</a></small></div>
      <div>${LODGING.has(p.k)?'<div><small>'+hotelLinks(p.n,p.town)+'</small></div>':''}${S.went[k]?'':`<button data-went="${k}">行ってきた</button>`}<button data-unwish="${k}">✕</button></div></div>`;}
    const mem=Object.keys(S.went).length;h+=`<div class="note">ふたりで行った店: ${mem}軒</div>`;}
  if(tab==='friends'){const stamps=Object.entries(S.stamps);h+=`<h3>友達とコレクション</h3><div class="sec">スタンプ帳(都道府県 ${stamps.length})</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">${stamps.length?stamps.map(([k,v])=>`<span style="border:1.5px solid var(--acc);color:var(--acc);border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font:700 11px var(--fd);text-align:center;transform:rotate(${(k.length*7)%9-4}deg)">${k.replace(/(都|府|県)$/,'')}</span>`).join(''):'<span class=note>まだありません。街に着くと押されます</span>'}</div>${S.souvenirs.length?`<div class="sec">お土産(${S.souvenirs.length})</div>`+S.souvenirs.slice().reverse().slice(0,12).map(x=>`<div class="row"><div>🎁 <b>${x.town}</b><small>${x.shop} / ${fmtD(x.t)}</small></div><span style="color:var(--ink2)">¥${fmt(x.price)}</span></div>`).join(''):''}<div class="sec">友達帳</div>`;if(!S.friends.length)h+='<div class="note">まだいません。同じ店に何度か通うと仲良くなります。</div>';
    for(const f of S.friends.slice().reverse()){h+=`<div class="row"><div>${'★'.repeat(Math.min(5,f.level))} <b>${f.name}</b>さん<small>${f.pn||''}の${f.role} / ${fmtD(f.t)}に出会った</small></div></div>`;}}
  if(tab==='more'){h+=`<h3>オフィストラベル(試作)</h3><div class="row"><div>家<small>${S.homeAddr||'サンプルの街(吉祥寺)'}${S.trip?' / いまは '+S.trip.city+' に滞在':''} / この街の店・場所 ${POIS.length}件</small></div></div>`;
    h+=`<div class="row"><div>設定<small>${S.name} / ${JOBS[S.job].n} / ${V().e}${V().n} / 勤務 ${fmtHM(S.work.start)}〜${fmtHM(S.work.end)} / 好み: ${S.prefs.map(k=>PREF_LIST.find(x=>x[0]===k)[1]).join('・')}</small></div><button id="bSetup">変える</button></div>`;
    h+=`<div class="row"><div>飛行機<small>公共交通オープンデータセンター(ODPT)のアクセストークンを貼ると、JAL・ANA国内線の実ダイヤで飛ぶ。${S.keys.odpt?(FLIGHTS?'便データ '+FLIGHTS.length+'件 読み込み済み':'鍵あり(次の遠出で読み込み)'):'未設定(それまでは鉄道だけ)'}</small></div><button id="bOdpt">${S.keys.odpt?'変更':'鍵を貼る'}</button></div>`;
    h+=`<div class="row"><div>アフィリエイト<small>楽天アフィリエイトID、じゃらん(バリューコマース)のsid/pid。入れると宿リンクが成果の入る形になる。${S.keys.rakutenAff?'楽天: 設定済 ':''}${S.keys.vcSid?'じゃらん: 設定済':''}</small></div><button id="bAff">設定</button></div>`;
    h+=`<div class="row"><div>写真<small>近くで撮られた本物の写真をWikimedia Commonsから。Mapillaryの無料トークンを入れると街角の写真も(任意)</small></div><button id="bMly">${S.mlyToken?'設定済':'トークン'}</button></div>`;
    h+=`<div class="row"><div>お小遣いを渡す<small>手持ち ¥${fmt(S.wallet)}。収穫のほかに、直接渡すこともできる(試作用)</small></div><button id="bGive">+¥1,000</button></div>`;
    h+=`<div class="row"><div>統計<small>収穫 ¥${fmt(S.stats.harvest)} / 使った ¥${fmt(S.stats.spent)} / 寄った ${S.stats.visits}軒 / 友達 ${S.friends.length}人</small></div></div>`;
    h+=`<div class="row"><div>小窓で開く<small>横長の別ウィンドウ</small></div><button id="bPop">開く</button></div>`;
    h+=`<div class="row"><div>詰まったとき<small>旅を中断して家に戻す。日記・友達・行きたいは残る</small></div><button id="bHomeNow">家に戻す</button></div>`;
    h+=`<div class="row"><div style="color:var(--ng)">データを消す</div><button id="bReset">消去</button></div>`;

    h+='<div class="note">地図と店: © OpenStreetMap contributors(ODbL)。店の人気メニューや口コミは「Googleマップで開く」から。</div>';}
  panel.innerHTML='<button class="pclose" id="pClose" title="閉じる">×</button>'+h;$('pClose').onclick=()=>openTab(tab);
  const fvEl=$('field');if(fvEl){fvEl.addEventListener('click',e=>{const r=fvEl.getBoundingClientRect();harvestAt(e.clientX-r.left);});}
  panel.querySelectorAll('[data-wish]').forEach(b=>b.onclick=()=>{const k=b.dataset.wish;if(S.wish.includes(k))S.wish=S.wish.filter(x=>x!==k);else{S.wish.push(k);const p=poiOf(k);if(p)remember(p);}renderPanel();save();});
  panel.querySelectorAll('[data-unwish]').forEach(b=>b.onclick=()=>{const k=b.dataset.unwish;S.wish=S.wish.filter(x=>x!==k);renderPanel();save();});
  panel.querySelectorAll('[data-went]').forEach(b=>b.onclick=()=>{const k=b.dataset.went;S.went[k]=Date.now();S.stats.memories++;const p=poiOf(k)||{n:''};addDiary({kind:'note',text:'あなたが'+p.n+'に行ってきた! 同じ店の思い出がふたつになった',t:Date.now()});bubble={text:'あそこ行ったの? いいよね!',until:performance.now()+5000,next:20000};toast(S.name+'「'+p.n+'行ったの? いいよね!」','var(--acc)');renderPanel();save();});
  panel.querySelectorAll('[data-ansp]').forEach(b=>b.onclick=()=>{const [id,key]=b.dataset.ansp.split('|');const a=S.asks.find(x=>String(x.id)===id);if(a&&!a.done)resolveAsk(a,key,false);renderPanel();});

  const rq=$('rqGo');if(rq)rq.onclick=async()=>{const cityName=$('rqCity').value;const txt=$('rqText').value.trim();

    if(!txt){toast('街を選ぶか、場所を入れてください','var(--ng)');return;}
    try{const rs=await geocode(txt);if(!rs.length){toast('見つかりませんでした','var(--ng)');return;}const r=rs[0];S.request={name:r.display_name.split(',')[0],la:+r.lat,lo:+r.lon};toast('次の朝、'+S.request.name+'へ向かいます','var(--acc)');renderPanel();save();}catch(e){toast('住所検索に失敗','var(--ng)');}};
  const rh=$('rqHome');if(rh)rh.onclick=()=>{S.request={name:'家',la:HOME.la,lo:HOME.lo,home:true};toast('次の朝、家に帰ります','var(--acc)');renderPanel();save();};

  // 家の街が保存されていない(容量不足・別ブラウザ等)のに設定済みなら、裏で取り直す
  if(S.setup&&S.homeLL&&!S.trip&&(!town||dist([town.center[0],town.center[1]],S.homeLL)>400)){const [la,lo]=S.homeLL;toast('家のまわりの地図を取り直しています…','var(--dim)');
    buildTown(la,lo,S.townName||'家のまわり',true,()=>{}).then(tn=>{initTown(tn);saveTown(tn);if(!j.pos||dist(j.pos,[la,lo])>3000){j.at=-1;j.pos=[la,lo];}toast('家のまわりの店・場所 '+POIS.length+'件','var(--acc)');}).catch(e=>{toast('地図を取り直せなかった。設定から家を選び直してください','var(--ng)');});}
  if(!S.setup||!M)showSetup();
  requestAnimationFrame(frame);})();
</script>
