<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>オフィストラベル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#faf6ee;--paper2:#f1ebdf;--line:#e3dccb;--ink:#2a2f3a;--ink2:#5b6270;--dim:#8a9099;
    --acc:#d9773b;--acc2:#f2c9ab;--ok:#3f8f5f;--ng:#c8503c;--info:#3a78b5;--gold:#b8860b;
    --map:#f3efe6;--shadow:0 6px 24px rgba(40,30,10,.14),0 1px 3px rgba(40,30,10,.10);
    --fd:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;--fb:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--map);color:var(--ink);font:13px/1.5 var(--fb);overflow:hidden;user-select:none}
  #basemap{position:absolute;inset:0;background:var(--map)}
  #basemap .maplibregl-ctrl-attrib{font-size:9px;opacity:.75}
  #map{position:absolute;left:0;top:0;right:0;bottom:0;display:block;pointer-events:none;background:transparent}
  #field{display:block;width:100%;height:96px;border-radius:10px;cursor:pointer;background:#6b8f4e;touch-action:manipulation}
  #dlg{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.98);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:9}
  #dlg.hidden{display:none}
  #dlg .q{font:700 14px/1.4 var(--fd);margin-bottom:8px}
  #dlg input,#dlg textarea{width:100%;box-sizing:border-box;padding:9px 10px;font:500 14px var(--fb);border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  #dlg .opts{display:flex;gap:6px;margin-top:8px}
  #dlg .opts button{padding:8px 14px;font-size:13px}
  @media (max-width:760px){#dlg{bottom:calc(60px + env(safe-area-inset-bottom))}}
  #ask,#poiCard{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:4}
  #ask .q,#poiCard .q{font:700 15px/1.3 var(--fd);margin-bottom:6px}
  #ask .opts,#poiCard .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  #ask .opts button,#poiCard .opts button{padding:8px 12px;font-size:13px}
  #ask .ttl{color:var(--dim);font-size:11px;margin-top:6px}
  .bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
  /* 家のシーン */
  #home{position:absolute;inset:0;background:#efe6d6;overflow:hidden}
  #home.hidden{display:none}
  #room{position:absolute;inset:0}
  body.vhome #basemap,body.vhome #map{visibility:hidden}
  body.vhome #basemap *{visibility:hidden!important}
  body.vhome #hfoot,body.vhome #bViewHome,body.vhome #poiCard{display:none!important}
  .room .bubble{font-size:1.05em;padding:.55em .8em;border-radius:1em}
  .room .bubble:after{left:45%}
  .room .memo{font-size:.95em}
  .room .memo button{font:500 .85em/1.2 var(--fb);padding:.35em .6em;margin:.2em .2em 0 0;border-radius:.45em}
  .room .memo .q{font:700 1.05em var(--fd);margin-bottom:.15em}
  .room .tag{font-size:.95em}
  .charTap{position:absolute;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.chips button{padding:6px 11px;border-radius:999px;font-size:13px;background:#fff}.chips button:disabled{opacity:.45}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}.grid3 button{padding:12px 6px;border-radius:12px;background:#fff;font-size:13px;line-height:1.3}.grid3 button i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}
  .row>div>small{display:block;color:var(--dim);font-size:11.5px;line-height:1.45;margin-top:2px;font-weight:400}
  .row>div:first-child{font-weight:600;color:var(--ink)}
  .sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.08);margin:0 2px;vertical-align:middle;cursor:pointer}.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
  #home.hidden{display:none}
  .memo button{font:500 .8em/1.2 var(--fb);padding:.3em .55em;margin:.2em .2em 0 0;border-radius:.4em}
  .memo .q{font:700 1em var(--fd);margin-bottom:.1em}
  .room{position:relative;font-size:13px;background:#efe6d6}
  .room svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .room .ov{position:absolute;box-sizing:border-box}
  .room .tap{cursor:pointer}
  .room .tap:active{transform:scale(.98)}
  .board{background:#f7efdc;border:.35em solid #b98a5a;border-radius:.4em;padding:.5em .6em;box-shadow:0 .3em .8em rgba(40,30,10,.18);font:500 1em/1.35 var(--fb);color:var(--ink)}
  .board .lbl{font:700 .8em var(--fd);color:var(--dim);letter-spacing:.1em}
  .board .big{font:700 1.15em/1.35 var(--fd);margin-top:.15em}
  .pin{position:absolute;left:50%;top:-.55em;width:.9em;height:.9em;border-radius:50%;background:var(--ng);transform:translateX(-50%);box-shadow:0 .1em .2em rgba(0,0,0,.25)}
  .cal{background:#fff;border-radius:.3em;box-shadow:0 .2em .5em rgba(40,30,10,.15);text-align:center;overflow:hidden}
  .cal .mo{background:var(--ng);color:#fff;font:700 .75em/1.6 var(--fd)}
  .cal .day{font:700 2.1em/1.1 var(--fd);color:var(--ink)}
  .cal .wd{font:500 .75em/1.3 var(--fb);color:var(--ink2)}
  .cal .wk{font:500 .7em/1.3 var(--fb);color:var(--dim);border-top:1px dashed var(--line);margin-top:.2em}
  .shelfItems{display:flex;align-items:flex-end;gap:.5em;padding:0 .3em}
  .gift{background:#f0c9a0;border-radius:.25em;padding:.3em .4em;font:700 .8em/1.2 var(--fd);color:#6b3f1d;box-shadow:0 .15em .3em rgba(0,0,0,.15);position:relative;white-space:nowrap}
  .gift:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:.35em;margin-left:-.175em;background:var(--ng);opacity:.7}
  .gift span{position:relative;z-index:1;background:#f0c9a0;padding:0 .15em}
  .frame{background:#fff;padding:.25em .25em .6em;box-shadow:0 .2em .5em rgba(40,30,10,.2);transform:rotate(-3deg);width:4.6em}
  .frame img{display:block;width:100%;height:3.2em;object-fit:cover;background:var(--paper2)}
  .frame small{display:block;font:500 .6em/1.2 var(--fb);color:var(--ink2);text-align:center;margin-top:.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stampbook{background:#5d7bb0;color:#fff;border-radius:.2em .4em .4em .2em;padding:.4em .5em;font:700 .8em/1.2 var(--fd);box-shadow:0 .15em .3em rgba(0,0,0,.2);white-space:nowrap}
  .memo{background:#fdf3b5;padding:.5em .6em;font:500 .85em/1.4 var(--fb);color:#4a4020;box-shadow:0 .2em .4em rgba(40,30,10,.18);transform:rotate(-2deg)}
  .memo b{font:700 1em var(--fd)}
  .walletTag{background:#3e5a3a;color:#fff;border-radius:.3em;padding:.3em .55em;font:700 .95em/1.2 var(--fd);box-shadow:0 .2em .4em rgba(0,0,0,.2);white-space:nowrap}
  .walletTag small{font:500 .65em var(--fb);opacity:.85;margin-right:.3em}
  .tag{background:rgba(250,246,238,.92);border:1px solid var(--line);border-radius:.4em;padding:.25em .55em;font:500 .9em/1.3 var(--fb);color:var(--ink2);white-space:nowrap}
  .doorTag{background:var(--ink);color:#fff;border-radius:.5em;padding:.45em .7em;font:700 .95em/1.2 var(--fd);white-space:nowrap;box-shadow:0 .2em .4em rgba(0,0,0,.25)}
  .bubble{background:#fff;border-radius:.8em;padding:.5em .75em;font:500 1em/1.35 var(--fb);color:var(--ink);box-shadow:0 .2em .5em rgba(40,30,10,.18);position:relative;max-width:100%}
  .bubble:after{content:"";position:absolute;left:1.2em;bottom:-.5em;border:.5em solid transparent;border-top-color:#fff;border-bottom:0}
  .sub{display:none!important}
  #morning{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:520px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);z-index:3}
  #morning .q{font:700 15px/1.3 var(--fd);margin-bottom:8px}
  #morning .opts{display:flex;flex-wrap:wrap;gap:6px}
  #morning .opts button{padding:8px 12px;font-size:13px}
  #btns button .cnt{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;line-height:16px;text-align:center}
  /* 上部: 今どこ */
  #hud{display:flex;gap:10px;align-items:flex-start;position:absolute;left:10px;top:8px;width:400px;max-width:calc(100% - 440px);background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;box-sizing:border-box}
  #hud .face{flex:none;width:46px;height:48px;border-radius:50%;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
  #hud .face svg{width:100%;height:100%;display:block}
  #hud .hbody{flex:1;min-width:0}
  #hud .now{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 11.5px var(--fd);color:var(--dim);letter-spacing:.08em}
  #hud .now b{font:600 12.5px var(--fb);color:var(--ink2);letter-spacing:0}
  #hud .st{font:700 17px/1.3 var(--fd);color:var(--ink);margin-top:3px}
  #hud .meta{font:500 12px/1.4 var(--fb);color:var(--ink2);margin-top:3px}
  #hfoot{position:absolute;left:10px;right:10px;bottom:14px;margin:0 auto;max-width:560px;background:rgba(250,246,238,.97);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:9px 12px;box-sizing:border-box}
  #hfoot.hidden{display:none}
  #bViewHome{position:absolute;right:10px;bottom:120px;padding:8px 12px;font:700 13px var(--fd);border-radius:999px;background:rgba(250,246,238,.97);box-shadow:var(--shadow)}
  #bViewHome.hidden{display:none}
  #hfoot .two{display:flex;gap:8px}
  #hfoot .big{flex:1;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:7px 12px;cursor:pointer;min-width:0}
  #hfoot .big small{display:block;font:600 11px var(--fd);color:var(--dim);letter-spacing:.06em}
  #hfoot .big b{display:block;font:700 15px/1.3 var(--fd);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hfoot .big.money b{color:#3e5a3a}
  #hfoot .chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:7px;scrollbar-width:none}
  #hfoot .chips::-webkit-scrollbar{display:none}
  #hfoot .chips button i{font-style:normal;color:var(--acc);font-weight:700;margin-left:3px}
  #hud .card{background:rgba(250,246,238,.94);border:1px solid var(--line);border-radius:12px;padding:6px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
  #hud .who{font-family:var(--fd);font-weight:700;font-size:14px;color:var(--ink)}
  #hud #status{font-size:13px;color:var(--ink);font-weight:500}
  #hud #wallet{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.3px}
  #hud .badge{background:transparent;border:0;padding:0;font-size:12px;color:var(--ink2)}
  #hud #clock{font-variant-numeric:tabular-nums}
  /* 右上: タブ */
  #btns{position:absolute;right:10px;top:8px;display:flex;gap:0;background:rgba(250,246,238,.94);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
  #btns button{background:transparent;border:0;border-radius:9px;padding:5px 10px;font:500 13px/1.2 var(--fb);color:var(--ink2);cursor:pointer;box-shadow:none;display:inline-flex;align-items:center;gap:5px;position:relative}
#btns button i{font-style:normal;font-size:14px;line-height:1}
#btns button .cnt{position:absolute;top:-2px;right:-2px}
  #btns button:hover{background:var(--paper2);color:var(--ink)}
  #btns button.act{background:var(--ink);color:#fff}
  button{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:5px 11px;font:500 13px/1.2 var(--fb);cursor:pointer}
  button:hover{background:#fff}
  button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  button:disabled{opacity:.45;cursor:default}
  button.buy,#modal button.buy,#sOk{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
  button.buy:hover,#sOk:hover{background:#c4692f}
  /* 右パネル: 日記・旅程 */
  #panel{position:absolute;right:10px;top:50px;bottom:16px;width:392px;max-width:calc(100% - 20px);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px;overflow:auto;box-shadow:var(--shadow)}
  #panel h3{margin:0 0 10px;font:700 17px/1.3 var(--fd);color:var(--ink);letter-spacing:.2px;padding-right:28px}
  #panel .pclose{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;padding:0;font-size:15px;line-height:1;color:var(--ink2)}
  #panel .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  #panel .row small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.45;margin-top:1px}
  #panel .row b{font-weight:700}
  #panel .row button{white-space:nowrap}
  #panel .note{color:var(--dim);font-size:11.5px;margin-top:8px;line-height:1.5}
  #panel a{color:var(--info);text-decoration:none;border-bottom:1px solid rgba(58,120,181,.3)}
  #panel a:hover{border-bottom-color:var(--info)}
  #panel button.on{color:var(--acc);border-color:var(--acc);background:#fff}
  #panel input,#panel select,#panel textarea{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  #panel input:focus,#panel textarea:focus,#panel select:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
  .polaroid{display:inline-block;width:110px;background:#fff;color:#222;padding:7px 7px 9px;margin:4px 6px 6px 0;border-radius:3px;box-shadow:0 3px 10px rgba(40,30,10,.18);transform:rotate(-1.2deg);vertical-align:top}
  .polaroid:nth-child(even){transform:rotate(1.2deg)}
  .polaroid .pic{height:74px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden}
  .polaroid .pic img{width:100%;height:100%;object-fit:cover;border-radius:2px;display:block}
  .polaroid .cap{font-size:10.5px;line-height:1.3;margin-top:6px;color:#333;font-family:var(--fd)}
  .polaroid .credit{font-size:8px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font:13.5px/1.6 var(--fb);color:var(--ink)}
.dl time{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px;padding-top:2px}
.dl .acts{font-weight:400;font-size:12px;margin-left:6px;white-space:nowrap;color:var(--ink2)}
.dl .acts button{padding:0 7px;font-size:12px;border-radius:999px;line-height:1.5;margin-right:4px}
.dl .acts a{color:var(--info)}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.pstrip::-webkit-scrollbar{display:none}
.pstrip .polaroid{flex:none;width:104px;margin:0;transform:rotate(-1deg)}
.receipt{font:12px/1.5 var(--fb);background:#fff;color:var(--ink);padding:8px 10px;border-radius:8px;margin:6px 0;border:1px solid var(--line);border-left:3px solid var(--acc2)}
  .receipt button{padding:3px 9px;font-size:12px}
  .tl{display:grid;grid-template-columns:44px 20px 1fr;gap:0 6px;align-items:start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.45}
  .tl .tlt{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
  .tl .tle{text-align:center}
  .tl .tlc{color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:6px}
  /* 見出しつきの区切り */
  #panel .sec{font:700 13px/1.3 var(--fd);color:var(--ink2);margin:14px 0 4px;letter-spacing:.4px}
  /* 設定・報告 */
  #modal{position:absolute;inset:0;background:rgba(42,47,58,.42);display:flex;align-items:center;justify-content:center;padding:8px}
  #modal .box{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;min-width:300px;max-width:min(640px,96%);max-height:94%;overflow:auto;text-align:center;font-size:13px;line-height:1.5;box-shadow:var(--shadow)}
  #modal h2{margin:0 0 6px;font:700 18px/1.3 var(--fd);color:var(--ink);text-wrap:balance}
  #modal p{margin:2px 0 8px;color:var(--ink2)}
  #modal .big{font-size:24px;color:var(--ink);margin:6px 0;font-variant-numeric:tabular-nums}
  #modal button{margin:4px}
  #modal select,#modal input{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  #modal input[type=time]{width:112px}
  #modal label{cursor:pointer}
  .hidden{display:none!important}
  #toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(42,47,58,.92);color:#fff;padding:6px 14px;border-radius:10px;pointer-events:none;transition:opacity .4s;opacity:0;font-size:12.5px;box-shadow:var(--shadow);max-width:90%}
  @media (max-width:760px){
    html,body{font-size:14px}
    #hud{left:8px;right:8px;top:8px;width:auto;max-width:none;padding:9px 12px}#hud .st{font-size:16px}
    #hfoot{bottom:calc(76px + env(safe-area-inset-bottom));left:8px;right:8px;padding:8px 10px}
    #home{bottom:calc(52px + env(safe-area-inset-bottom))}
    #bViewHome{right:8px;bottom:calc(196px + env(safe-area-inset-bottom))}
    #basemap .maplibregl-ctrl-attrib{font-size:9px;line-height:18px;padding:0 6px}
    #hud .card{padding:6px 10px;gap:8px}
    #btns{top:auto;bottom:0;left:0;right:0;border-radius:0;border:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;background:rgba(250,246,238,.98)}
    #btns button{padding:5px 2px 4px;font-size:10.5px;min-width:40px;flex:1;white-space:nowrap;flex-direction:column;gap:2px}
    #btns button i{font-size:19px}
    #btns button.act{background:transparent;color:var(--ink)}#btns button.act i{background:var(--ink);border-radius:12px;padding:2px 10px;color:#fff}
    #btns button .cnt{top:0;right:calc(50% - 22px)}
    #panel{left:0;right:0;width:auto;top:auto;bottom:calc(52px + env(safe-area-inset-bottom));height:60%;border-radius:16px 16px 0 0;padding:14px 14px 18px}
    #morning,#ask,#poiCard{bottom:calc(60px + env(safe-area-inset-bottom))}
    #basemap .maplibregl-ctrl-bottom-right,#basemap .maplibregl-ctrl-bottom-left{bottom:calc(52px + env(safe-area-inset-bottom))}
    #toast{bottom:calc(64px + env(safe-area-inset-bottom))}
    #modal .box{padding:12px 14px;max-height:92%}
    .pstrip .polaroid{width:104px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="basemap"></div>
<canvas id="map"></canvas>
<div id="home" class="hidden"><div class="room" id="room"><svg id="scene" viewBox="0 0 480 640" preserveAspectRatio="none"></svg><div id="ov"></div></div></div>
<div id="hfoot" class="hidden"></div>
<button id="bViewHome" class="hidden" title="家を見る">🏠 家</button>
<div id="morning" class="hidden"></div>
<div id="ask" class="hidden"></div>
<div id="poiCard" class="hidden"></div>
<div id="dlg" class="hidden"></div>
<div id="hud"></div>
<div id="btns">
  <button id="bHome"><i>🏠</i><span>うち</span></button>

  let best=-1,bd=18;const e={clientX:cx,clientY:cy};for(let i=0;i<POIS.length;i++){const [x,y]=px(POIS[i].la,POIS[i].lo);const d=Math.hypot(x-e.clientX,y-e.clientY);if(d<bd){bd=d;best=i;}}
  if(best>=0)showPoiCard(best);else $('poiCard').classList.add('hidden');}
function showPoiCard(i){const p=POIS[i];const k=remember(p);const price=priceOf(p);const el=$('poiCard');const v=S.visited[k];const op=isOpen(p.h,new Date());
  el.innerHTML=`<div class="q">${info(p).e} ${p.n}</div><div style="color:var(--ink2);font-size:12px">${info(p).label}${CUIS[p.c]?'・'+menuName(p):''}${price?' / ¥'+fmt(price)+'くらい':''}${p.h?' / '+(op===false?'<span style="color:var(--ng)">いま閉店中</span>':'営業時間 '+p.h):''}${v?' / '+S.name+'は'+v.n+'回':''}</div>
    <div class="opts"><button data-w="1">${S.wish.includes(k)?'♥ 行きたいから外す':'♡ 行きたい'}</button><button data-go="1" class="buy">今すぐ寄って</button><a href="${gmapsLL(p)}" target="_blank" rel="noopener" style="align-self:center;margin-left:4px">Googleマップ</a><button data-x="1" style="margin-left:auto">閉じる</button></div>`;
  el.querySelector('[data-w]').onclick=()=>{if(S.wish.includes(k))S.wish=S.wish.filter(x=>x!==k);else S.wish.push(k);save();showPoiCard(i);if(tab==='wish')renderPanel();};
  el.querySelector('[data-go]').onclick=()=>{const now=Date.now();if(!inWork(now)){toast('勤務時間外は動きません。行きたいには入れておきます','var(--ng)');if(!S.wish.includes(k))S.wish.push(k);save();return;}if(S.j.transit||S.j.cityTarget){toast('いま乗り物で移動中なので、着いてから','var(--ng)');if(!S.wish.includes(k))S.wish.push(k);save();return;}
    if(op===false){toast('いま閉まっています。行きたいに入れました');if(!S.wish.includes(k))S.wish.push(k);save();return;}
    addDiary({kind:'note',text:'あなたに「'+p.n+'に寄って」と言われたので、そこへ向かう',t:now});S.j.straight=null;go(i,now);toast(S.name+'が'+p.n+'へ向かいます','var(--acc)');el.classList.add('hidden');save();};
  el.querySelector('[data-x]').onclick=()=>el.classList.add('hidden');el.classList.remove('hidden');}
$('basemap').addEventListener('click',e=>{if(!MAPBASE)onMapClick(e.clientX,e.clientY);});
setInterval(save,5000);addEventListener('beforeunload',save);
resize();
(function boot(){let town=null;try{const raw=localStorage.getItem(TOWN_KEY);if(raw)town=JSON.parse(raw);}catch(e){}
  if(S.trip){let away=null;try{const a=JSON.parse(localStorage.getItem(AWAY_KEY)||'null');if(a&&a.name===S.trip.city)away=a.nodes?a:townCacheGet(a.name,a.la,a.lo);}catch(e){}if(away)town=away;}
  const j=S.j;j.planning=null;j.cityTarget=null;const wasLoading=j.loadingTown;j.loadingTown=null;
  let awayMissing=false;if(S.trip&&(!town||town.name!==S.trip.city)){awayMissing=true;}
  if(town){initTown(town);if(town.wideLoaded===false||(town.wide&&!town.wide.length&&!town.wideLoaded))setTimeout(()=>loadWideAsync(town,town.center[0],town.center[1]),3000);}else if(typeof KICHI!=='undefined'){initTown(KICHI);}
  if(S.setup&&M&&(awayMissing||wasLoading)&&S.trip){const c=CITIES_JP.find(x=>x[0]===S.trip.city);const la=c?c[1]:(j.pos?j.pos[0]:M.center[0]),lo=c?c[2]:(j.pos?j.pos[1]:M.center[1]);
    j.state='stay';j.until=Date.now()+60000;setTimeout(()=>arriveCity({name:S.trip.city,la,lo,resume:true},Date.now()),500);}
  // 家の街が保存されていない(容量不足・別ブラウザ等)のに設定済みなら、裏で取り直す
  if(S.setup&&S.homeLL&&!S.trip&&(!town||dist([town.center[0],town.center[1]],S.homeLL)>400)){const [la,lo]=S.homeLL;toast('家のまわりの地図を取り直しています…','var(--dim)');
    buildTown(la,lo,S.townName||'家のまわり',true,()=>{}).then(tn=>{initTown(tn);saveTown(tn);if(!j.pos||dist(j.pos,[la,lo])>3000){j.at=-1;j.pos=[la,lo];}toast('家のまわりの店・場所 '+POIS.length+'件','var(--acc)');}).catch(e=>{toast('地図を取り直せなかった。設定から家を選び直してください','var(--ng)');});}
  if(!S.setup||!M)showSetup();
  viewHomeUntil=Date.now()+2500;checkFlightsStatic();fState=S.j.state;setView((S.j.at===-1&&S.j.state!=='walk'&&!S.j.transit&&!S.trip)?'home':'map');
  requestAnimationFrame(frame);})();
</script>
